<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VitaDemo Workshop Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root{--bg:#07070a;--ink:#f4f4f6;--mut:#8b8b96;--dim:#55555f;--glass:rgba(255,255,255,.035);--edge:rgba(255,255,255,.08);
  --red:#e50914;--red2:#ff3b45;--glow:rgba(229,9,20,.35);--r:20px}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 "IBM Plex Sans Thai",sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.num{font-family:"Space Grotesk","IBM Plex Sans Thai",sans-serif;letter-spacing:-.02em}
a{color:var(--red2)}

/* background */
.mesh{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.mesh i{position:absolute;border-radius:50%;filter:blur(100px);opacity:.4;animation:drift 24s ease-in-out infinite}
.mesh i:nth-child(1){width:44vw;height:44vw;background:#7a050b;left:-14vw;top:-20vw}
.mesh i:nth-child(2){width:34vw;height:34vw;background:#e50914;right:-16vw;top:30vh;opacity:.18;animation-delay:-9s}
@keyframes drift{50%{transform:translate(5vw,6vh) scale(1.12)}}

/* header + tabs */
header{position:sticky;top:0;z-index:30;background:rgba(7,7,10,.78);backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--edge)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(3vw,16px) 6px}
.brand{display:flex;align-items:center;gap:10px;font:700 16px "Space Grotesk",sans-serif;cursor:pointer}
.brand b{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--red),#7a050b);display:grid;place-items:center;font-size:14px;box-shadow:0 0 20px var(--glow)}
.brand small{font:400 12px "IBM Plex Sans Thai";color:var(--mut);margin-left:4px}
.prog{font-size:12px;color:var(--mut);white-space:nowrap}
.prog b{color:var(--red2)}
nav{position:relative;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:0 max(3vw,16px)}
nav::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;color:var(--mut);font:500 14px "IBM Plex Sans Thai";padding:10px 14px 12px;cursor:pointer;white-space:nowrap;transition:color .25s}
.tab small{display:block;font-size:10.5px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;line-height:1.2;transition:color .25s}
.tab:hover{color:#fff}
.tab[aria-selected=true]{color:#fff}
.tab[aria-selected=true] small{color:var(--red2)}
.ink{position:absolute;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--red);box-shadow:0 0 14px var(--glow);transition:left .4s cubic-bezier(.16,1,.3,1),width .4s cubic-bezier(.16,1,.3,1)}

main{max-width:1280px;margin:0 auto;padding:24px max(3vw,16px) 60px}
.panel{display:none}
.panel.on{display:block;animation:in .55s cubic-bezier(.16,1,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(18px);filter:blur(4px)}}

/* panel head */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.ph .k{font:600 12px "Space Grotesk";color:var(--red2);letter-spacing:.18em;text-transform:uppercase}
.ph h1{margin:2px 0 0;font-size:clamp(24px,3vw,32px);font-weight:600;line-height:1.2}
.ph p{margin:4px 0 0;color:var(--mut);max-width:760px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--edge);background:var(--glass);color:#d8d8de}
.chip.r{border-color:rgba(229,9,20,.5);background:rgba(229,9,20,.12);color:#ffd0d3}
.btn{display:inline-flex;align-items:center;gap:6px;font:500 13px "IBM Plex Sans Thai";padding:8px 14px;border-radius:10px;text-decoration:none;color:#fff;
  background:linear-gradient(135deg,var(--red),#9b0610);box-shadow:0 6px 20px -8px var(--glow);border:0;cursor:pointer;transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
.btn.g{background:var(--glass);border:1px solid var(--edge);box-shadow:none;color:#ddd}

/* cards */
.c{position:relative;border-radius:var(--r);background:var(--glass);border:1px solid var(--edge);padding:20px 22px;overflow:hidden;
   transition:transform .45s cubic-bezier(.16,1,.3,1),border-color .3s,box-shadow .3s}
.c.hov:hover{transform:translateY(-4px);border-color:rgba(229,9,20,.45);box-shadow:0 20px 50px -20px var(--glow);cursor:pointer}

/* overview */
.hero{padding:28px 0 22px}
.hero h1{margin:8px 0 6px;font-size:clamp(34px,6vw,68px);font-weight:700;line-height:1.02;
  background:linear-gradient(180deg,#fff 35%,#ffb3b7 75%,var(--red));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);margin:0;max-width:720px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:22px 0 28px}
.stats .c b{display:block;font-size:clamp(24px,3vw,34px)}
.stats .c span{font-size:13px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.lc .n{font:700 48px/1 "Space Grotesk";color:transparent;-webkit-text-stroke:1.5px #3a3a44;position:absolute;right:16px;top:10px;transition:all .4s}
.lc:hover .n{-webkit-text-stroke-color:var(--red)}
.lc .t{font-size:12px;color:var(--red2);letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.lc h3{margin:4px 0 6px;font-size:18px;font-weight:600;padding-right:56px}
.lc p{margin:0 0 12px;color:#c9c9d1;font-size:14px}
.lc .who{font-size:12px;color:var(--mut)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#9be7a8}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:#3ccf5b;box-shadow:0 0 8px #3ccf5b}
.st.w{color:#ffd27a}.st.w::before{background:#f0b429;box-shadow:0 0 8px #f0b429}
.st.x{color:var(--mut)}.st.x::before{background:#555;box-shadow:none}
@media (max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.grid,.stats{grid-template-columns:minmax(0,1fr)}}

/* iframe */
.frame{position:relative;margin:0 calc(-1 * max(3vw,16px))}
.frame iframe{display:block;width:100%;height:80vh;border:0;background:transparent;overflow:hidden;transition:height .3s ease}
.frame .ld{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);font-size:13px;pointer-events:none;transition:opacity .4s}
.frame.ok .ld{opacity:0}

/* sub tabs */
.sub{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:12px;background:var(--glass);border:1px solid var(--edge);margin-bottom:14px}
.sub button{border:0;background:none;color:var(--mut);font:500 13px "IBM Plex Sans Thai";padding:7px 14px;border-radius:9px;cursor:pointer;transition:all .3s}
.sub button[aria-pressed=true]{color:#fff;background:linear-gradient(135deg,var(--red),#9b0610)}
.sp{display:none}.sp.on{display:block;animation:in .45s cubic-bezier(.16,1,.3,1)}

/* markdown */
.prose{max-width:none}
.prose h1{font-size:26px;margin:0 0 12px;line-height:1.25}
.prose h2{font-size:20px;margin:28px 0 10px;padding-top:16px;border-top:1px solid var(--edge);display:flex;gap:10px;align-items:center}
.prose h2::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--red);flex:none}
.prose h3{font-size:16px;margin:20px 0 8px;color:#fff}
.prose p,.prose li{color:#d8d8de}
.prose blockquote{margin:12px 0;padding:12px 16px;border-left:3px solid var(--red);background:rgba(229,9,20,.06);border-radius:0 12px 12px 0}
.prose blockquote p{margin:4px 0}
.prose code{font-size:.88em;background:rgba(255,255,255,.07);padding:1px 6px;border-radius:6px}
.prose pre{background:#0f0f14;border:1px solid var(--edge);border-radius:12px;padding:14px;overflow-x:auto}
.prose pre code{background:none;padding:0}
.prose .tw{overflow-x:auto;margin:12px 0;border-radius:12px;border:1px solid var(--edge)}
.prose table{border-collapse:collapse;width:100%;font-size:13.5px}
.prose th{background:rgba(255,255,255,.05);color:#fff;font-weight:600;text-align:left}
.prose th,.prose td{padding:8px 12px;border-bottom:1px solid var(--edge);vertical-align:top}
.prose tr:hover td{background:rgba(229,9,20,.06)}
.prose hr{border:0;border-top:1px solid var(--edge);margin:24px 0}
.prose input[type=checkbox]{accent-color:var(--red);margin-right:6px}
.prose ul:has(input){list-style:none;padding-left:4px}

/* agents */
.ag{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:800px){.ag{grid-template-columns:minmax(0,1fr)}}
.ag h3{margin:0;font-size:17px;font-family:"Space Grotesk","IBM Plex Sans Thai"}
.ag .d{color:#c9c9d1;font-size:14px;margin:6px 0 10px}
.ag details summary{cursor:pointer;color:var(--mut);font-size:13px;margin-top:10px}
.ag details .prose{margin-top:8px;font-size:13.5px}
.av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#2a2a33,#15151b);border:1px solid var(--edge);font-size:18px;flex:none}
.ah{display:flex;gap:12px;align-items:center}

.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
.foot{margin-top:30px;font-size:12px;color:var(--dim)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="mesh"><i></i><i></i></div>
<header>
  <div class="bar">
    <div class="brand" data-go="overview"><b>V</b>VitaDemo Workshop Hub<small>Marketing Team in Claude Code</small></div>
    <div class="prog"><b>11/12</b> ช่วงเสร็จ · ข้อมูลจำลอง</div>
  </div>
  <nav id="tabs" role="tablist"><span class="ink" id="ink"></span></nav>
</header>
<main id="main"></main>

<script>
const H = {"md": {"claude": "# CLAUDE.md · VitaDemo Marketing Workspace\n\n## 1. ภาพรวมโปรเจค\n- ที่ทำงานของทีมการตลาดแบรนด์อาหารเสริมสมมุติ VitaDemo (อบรม Hopeful 27 พ.ย. 2569)\n- ข้อมูลอยู่ใน `data/` (CSV UTF-8 ภาษาไทย อ่าน `data/README.md` ก่อน) · ผลงานเก็บที่ `output/`\n- สินค้า 4 ตัว (`data/products.csv`): Fish Oil 1000 mg 590฿ · Collagen Tripeptide 890฿ · Multivitamin 50+ 450฿ · Lutein Plus 690฿ (ใหม่สุด เปิด 2024-02)\n- ยอดขายนับเฉพาะ `order_status` = \"สำเร็จ\" และใช้ `net_amount_thb`\n\n## 2. แบรนด์และกลุ่มเป้าหมาย\n- ลูกค้าหลักอายุ 40 ปีขึ้นไป (กลุ่มใหญ่สุด 55–64 ปี) มีตัวแทนขายบางส่วน\n- ขาย 5 ช่องทาง: LINE OA, Shopee, Lazada, TikTok Shop, Facebook\n\n## 3. ภาษาและน้ำเสียง\n- ภาษาไทย อบอุ่น น่าเชื่อถือ เข้าใจง่าย\n- ไม่ขายเกินจริง ตัวหนังสืออ่านง่ายสำหรับผู้ใหญ่\n\n## 4. ข้อห้าม\n- ห้ามอ้างว่ารักษา ป้องกัน หรือบรรเทาโรค\n- ใช้ข้อมูลจำลองเท่านั้น ห้ามใส่ข้อมูลลูกค้าจริงหรือข้อมูลสุขภาพ\n- คำถามเรื่องทานคู่กับยาหรือโรคประจำตัว ให้ส่งต่อเภสัชกร\n- ห้ามแต่งตัวเลขเอง ทุกตัวเลขต้องคำนวณจากไฟล์ใน `data/`\n\n## 5. คำสั่งที่ใช้บ่อย\n- `/plan` วางแผนก่อนลงมือ · `/clear` ล้างบทสนทนา · `/model` เปลี่ยนโมเดล\n", "skill": "# VitaDemo Brand Voice\n\n## บุคลิกแบรนด์ 3 คำ\n**อบอุ่น · น่าเชื่อถือ · เข้าใจง่าย** เหมือนลูกหลานที่เป็นเภสัชกร คุยกับคุณพ่อคุณแม่วัย 40+\n\n## น้ำเสียง\n| ทำ | ไม่ทำ |\n|---|---|\n| พูดเหมือนคุยกับคนในครอบครัว ใช้ \"คุณ\" และลงท้าย \"ค่ะ/ครับ\" | ตะโกนขาย ใช้ ALL CAPS หรือ !!! ซ้อน |\n| ประโยคสั้น ย่อหน้าละ 1–2 บรรทัด อ่านง่ายบนมือถือ | ศัพท์แพทย์หรือศัพท์อังกฤษที่ไม่อธิบาย |\n| บอกข้อเท็จจริงที่ตรวจได้: เลข อย. ขนาด ราคา วิธีทาน | สัญญาผลลัพธ์ หรือกำหนดเวลา \"เห็นผลใน 7 วัน\" |\n| เล่าจากชีวิตประจำวัน (ทำงานหน้าจอ ดูแลคุณแม่) | ทำให้กลัว หรือว่ากล่าวเรื่องอายุ/รูปร่าง |\n| ชวนทักแชทเพื่อปรึกษา ปิดด้วย call-to-action เดียว | เร่งกดดัน \"หมดแล้วหมดเลย\" ทุกโพสต์ |\n\n## คำที่ใช้ / คำที่ห้ามใช้\n- **ใช้:** ดูแล · บำรุง · ช่วยเสริม · เป็นส่วนหนึ่งของการดูแลสุขภาพ · ทานต่อเนื่อง · ปรึกษาเภสัชกร · มีเลข อย. · คุณภาพที่ตรวจสอบได้\n- **ห้าม:** รักษา · ป้องกันโรค · บรรเทา · หายขาด · ดีที่สุด · อันดับ 1 · 100% · เห็นผลทันที · ปลอดภัยไร้ผลข้างเคียง · แทนยา · ชื่อโรค (เบาหวาน ความดัน ต้อกระจก ฯลฯ)\n\n## ข้อห้ามตามกฎโฆษณาอาหารเสริม\n1. ห้ามอ้างว่ารักษา ป้องกัน หรือบรรเทาโรคหรืออาการใด ๆ\n2. ห้ามคำเกินจริง/สัมบูรณ์ (ดีที่สุด หายขาด 100% เห็นผลทันที)\n3. ห้ามใช้รีวิวที่อ้างสรรพคุณทางยา (เช่น \"รักษาเบาหวานได้\") แม้ลูกค้าเขียนเอง\n4. ห้ามใช้หน้าแพทย์/เภสัชกรรับรองสินค้า และห้ามคนดังที่ไม่ได้รับอนุญาต\n5. คำถามเรื่องทานคู่กับยา ตั้งครรภ์ หรือโรคประจำตัว → \"ส่งต่อเภสัชกร\" ห้ามตอบเอง\n6. ใส่ \"ผลิตภัณฑ์เสริมอาหาร ไม่มีผลในการป้องกันหรือรักษาโรค\" ในโพสต์ขายทุกครั้ง\n7. ตัวเลข ราคา โปร ต้องมาจากไฟล์ใน data/ เท่านั้น ห้ามแต่ง\n\n## จุดเด่นที่ลูกค้าพูดเอง (จาก reviews_2025.csv ใช้เป็นมุมเล่าได้)\nมีเลข อย. ชัดเจน สบายใจ · เภสัชกรในไลฟ์อธิบายเข้าใจง่าย · ซองชงง่าย ไม่มีกลิ่นคาว · แคปซูลไม่ใหญ่ กลืนง่าย · ซื้อเป็นของขวัญให้ผู้ใหญ่ · แอดมินตอบไว\n\n## ตัวอย่างประโยคที่ดี\n1. \"ทำงานหน้าจอทั้งวัน ลองเพิ่มลูทีนเป็นตัวช่วยดูแลดวงตาในแต่ละวันนะคะ\"\n2. \"แคปซูลเล็ก กลืนง่าย คุณแม่ทานต่อเนื่องได้สบาย มีเลข อย. ตรวจสอบได้ค่ะ\"\n3. \"ไม่แน่ใจว่าทานคู่กับยาประจำตัวได้ไหม ทักแชทมาปรึกษาเภสัชกรของเราได้เลยค่ะ\"\n\n## เช็กก่อนส่งทุกครั้ง\n- [ ] ไม่มีคำในรายการห้าม ไม่มีชื่อโรค\n- [ ] มีข้อความ \"ผลิตภัณฑ์เสริมอาหาร...\" (ถ้าเป็นโพสต์ขาย)\n- [ ] ย่อหน้าแรกจบใจความ · CTA เดียว", "lab4": "# Lab 4 · แผนคอนเทนต์ 2 สัปดาห์ เปิดตัวแคลเซียมสูตรใหม่ VitaDemo\n\n> ทำโดย sub-agent **content-writer** ใช้ **Skill brand-voice** (`.claude/skills/brand-voice/SKILL.md`) และ `CLAUDE.md`\n> อ่านจาก `output/lab3-pillars.html` และ `data/line_oa_broadcast_2025.csv` · ทำวันที่ 27 พ.ย. 2569\n> VitaDemo เป็นแบรนด์สมมุติ ข้อมูลทุกไฟล์เป็นข้อมูลจำลอง\n\n**ช่องว่างข้อมูลที่ต้องเติมก่อนโพสต์:** `data/products.csv` ยังไม่มีแคลเซียมสูตรใหม่ จึงยังไม่รู้สูตร ปริมาณ ขนาด ราคา และเลข อย. และใน `data/` ก็ยังไม่มีโปรใดของแคมเปญนี้ ทุกจุดจึงใช้ตัวแทน `[...]` ไว้ และไม่ได้แต่งตัวเลขขึ้นเอง (ดูรายการท้ายไฟล์)\n\n---\n\n## 0. Pillar ที่ใช้ (จาก Lab 3)\n\n| Pillar | ชื่อ | สัดส่ว | 6.78% | 7.89 |\n\n**ข้อสรุป**\n- การส่งแบบเลือกกลุ่ม (20 ครั้ง) บล็อก **0.39%** ส่วนการส่งถึงเพื่อนทั้งหมด (15 ครั้ง) บล็อก **0.72%** สูงเกือบ 2 เท่า และ CTR ต่ำกว่า (7.52% เทียบกับ 12.08%)\n- \"ทั้งหมด × Rich message\" ทำให้เกิดการบล็อก 1,760 จาก 2,576 ครั้งของทั้งปี (68%) แผนนี้จึง**ไม่ใช้ Rich message ส่งถึงทุกคน**\n- \"ทั้งหมด × Coupon\" บล็อกต่ำสุด (0.24%) แต่มีแค่ 1 ครั้ง ยังเชื่อไม่ได้\n- กลุ่ม \"หญิง 40+ × Rich message\" บล็อกต่ำ แต่ CTR (6.02%) และยอดขายต่อการส่ง (5.77฿) ต่ำสุด จึงไม่เลือกกลุ่มนี้สำหรับข้อความของขวัญ\n- หมายเหตุข้อมูล: ชื่อข้อความบางรายการไม่ตรงกับวันส่ง (เช่น \"โปร 10.10\" ส่งช่วง พ.ย.–ธ.ค.) ตัวเลขข้างบนจึงใช้เปรียบเทียบตามกลุ่มผู้รับและประเภทข้อความเท่านั้น ไม่ได้ดูตามหัวข้อ\n\n---\n\n## 2. แผนโพสต์ 2 สัปดาห์ (จ. 30 พ.ย. – อา. 13 ธ.ค. 2569)\n\nข้อเสนอ: วันเปิดตัว อ. 1 ธ.ค. (ปรับได้ตามวันที่สินค้าพร้อม) · วันพ่อ ส. 5 ธ.ค. และ 12.12 ตรงกับ ส. 12 ธ.ค. อยู่ในช่วงนี้ · ★ = ชิ้นที่เขียนเต็มไว้ในข้อ 3–4\n\n| # | วัน | ช่องทาง | Pillar | Funnel | หัวข้อ |\n|---|---|---|---|---|---|\n| 1 | จ. 30 พ.ย. | FB | P1 | See | ★ FB-1 \"3 คำถามเรื่องแคลเซียมที่เภสัชกรได้ยินบ่อยจากคนวัย 40+\" |\n| 2 | อ. 1 ธ.ค. | FB | P2 | Do | ★ FB-2 เปิดตัวแคลเซียมสูตรใหม่ ข้อมูลบนฉลากครบ มีเลข อย. ตรวจสอบได้ |\n| 3 | พ. 2 ธ.ค. | FB | P3 | Think | เช็กลิสต์ \"ก่อนซื้อแคลเซียมให้คุณพ่อ ถามท่าน 3 ข้อนี้ก่อน\" (ทานยาอะไรอยู่ กลืนเม็ดสะดวกไหม ชอบแบบไหน) |\n| 4 | พ. 2 ธ.ค. | LINE | P3 | Do | ★ LINE-2 ชุดของขวัญวันพ่อ สำหรับลูกค้าประจำ · กลุ่ม **ลูกค้า VIP** |\n| 5 | พฤ. 3 ธ.ค. | FB | P3 | Do | ★ FB-3 ชุดของขวัญวันพ่อ แคลเซียมสูตรใหม่พร้อมการ์ด ส่งถึงบ้านท่าน |\n| 6 | ศ. 4 ธ.ค. | FB | P2 | See | อินโฟกราฟิก \"ฉลากแคลเซียมบอกอะไรเรา อ่าน 4 จุดนี้ก่อนซื้อ\" |\n| 7 | ส. 5 ธ.ค. | FB | P3 | See | วันพ่อ: \"โทรหาพ่อวันนี้ ถามเรื่องการกินดื่มของท่านบ้างหรือยัง\" (ไม่ขายของ) |\n| 8 | อา. 6 ธ.ค. | FB | P1 | Think | \"ซิเตรตกับคาร์บอเนตต่างกันอย่างไร ทานตอนไหนดี\" |\n| 9 | จ. 7 ธ.ค. | FB | P1 | Think | \"แคลเซียมวันละเท่าไหร่ถึงพอ ได้จากอาหารพอไหม\" (อ้างกรมอนามัย ตามแหล่ง S2 S3 ใน Lab 3) |\n| 10 | จ. 7 ธ.ค. | LINE | P1 | Think | ★ LINE-1 ชวนดูไลฟ์เภสัชกรตอบเรื่องแคลเซียม · กลุ่ม **อายุ 50+** |\n| 11 | อ. 8 ธ.ค. | FB | P2 | Think | คลิป \"เช็กเลข อย. เองใน 1 นาที ด้วยแอป ORYOR\" |\n| 12 | พ. 9 ธ.ค. | FB | P1 | Think | ไลฟ์ \"ถามเภสัชกร: แคลเซียมสำหรับวัย 40+\" 2 ทุ่ม |\n| 13 | พฤ. 10 ธ.ค. | FB | P2 | Think | \"คำโฆษณาอาหารเสริมแบบไหนควรสงสัย\" (อ้าง อย. S11 S12 ไม่พาดพิงคู่แข่ง) |\n| 14 | ศ. 11 ธ.ค. | FB | P1 | Do | \"ทานยาประจำอยู่ ไม่แน่ใจว่าทานคู่ได้ไหม ทักแชทปรึกษาเภสัชกรก่อนสั่ง\" |\n| 15 | ศ. 11 ธ.ค. | LINE | P2 | Do | แจ้งล่วงหน้า 12.12 แคลเซียมสูตรใหม่ `[โปร 12.12]` · กลุ่ม **ซื้อเกิน 60 วัน** (Text: บล็อก 0.43% · CTR 12.18%) |\n| 16 | ส. 12 ธ.ค. | FB | P2 | Do | 12.12 แคลเซียมสูตรใหม่ ฉลากครบ มีเลข อย. `[โปร 12.12]` |\n| 17 | อา. 13 ธ.ค. | FB | P1 | Care | สรุปคำถามจากไลฟ์ 9 ธ.ค. ฉบับอ่านง่าย |\n| 18 | อา. 13 ธ.ค. | LINE | P1 | Care | ข้อความอัตโนมัติหลังซื้อ 7 วัน \"ทานเป็นอย่างไรบ้างคะ\" · กลุ่ม **ผู้ซื้อสูตรใหม่** (ส่งตามวันซื้อ ไม่ใช่ broadcast) |\n\n**ภาพรวมแผน:** 18 ชิ้น · FB 14 · LINE 4 · P1 8 / P2 6 / P3 4 · See 3 / Think 7 / Do 6 / Care 2\nLINE ส่งแค่ 4 ครั้งใน 2 สัปดาห์ และทุกครั้งเลือกกลุ่มผู้รับ ไม่มีการส่งถึงเพื่อนทั้งหมด เพื่อให้มีคนบล็อกน้อย\n\n---\n\n## 3. โพสต์ Facebook 3 โพสต์\n\n### FB-1 · 3 คำถามเรื่องแคลเซียม ที่เภสัชกรได้ยินบ่อยจากคนวัย 40+\n**Pillar:** P1 ถามเภสัชกร · **Funnel:** See · **วันโพสต์:** จ. 30 พ.ย. · **ประเภท:** ให้ความรู้ (ไม่ใช่โพสต์ขาย)\n\n> แคลเซียมทานตอนไหนดี วันละเท่าไหร่ถึงพอ แล้วทานคู่กับยาได้ไหม 3 คำถามนี้เภสัชกรของเราได้ยินจากคุณพ่อคุณแม่วัย 40+ บ่อยมากค่ะ วันนี้สรุปให้สั้น ๆ ค่ะ\n>\n> **1. ทานตอนไหนดี**\n> แคลเซียมแต่ละชนิดทานไม่เหมือนกันค่ะ อย่างแคลเซียมซิเตรตทานได้ทั้งก่อนและหลังอาหาร\n> ทางที่ดีคืออ่านวิธีทานบนฉลากของสินค้าที่คุณมีอยู่ก่อนนะคะ\n>\n> **2. วันละเท่าไหร่ถึงพอ**\n> กรมอนามัยแนะนำว่าคนอายุ 51 ปีขึ้นไปควรได้แคลเซียมราว 1,000 มิลลิกรัมต่อวัน\n> ตัวเลขนี้นับรวมจากอาหารทุกมื้อ เริ่มจากอาหารในแต่ละวันก่อนได้เลยค่ะ\n>\n> **3. ทานคู่กับยาได้ไหม**\n> ข้อนี้เภสัชกรขอดูเป็นรายคนค่ะ เพราะแคลเซียมอาจรบกวนการดูดซึมยาบางชนิดและธาตุเหล็ก จึงอาจต้องทานห่างกัน\n>\n> ทานยาประจำอยู่ หรืออยากถามข้อไหนเพิ่ม ทักแชทมาคุยกับเภสัชกรของเราได้เลยค่ะ\n\nที่มาของข้อมูล: ข้อ 1 = S1 (คลังข้อมูลยา คณะเภสัชศาสตร์ ม.มหิดล) · ข้อ 2 = S2 (อ้างกรมอนามัย) · ข้อ 3 = S7 S8 S13 ตามที่อ้างใน `output/lab3-pillars.html`\nภาพประกอบ: การ์ดคำถาม 3 ใบ ห้ามใช้ภาพเภสัชกรถือสินค้า (ข้อห้ามข้อ 4)\n\n**เช็กลิสต์ brand-voice**\n- ✅ ไม่มีคำในรายการห้าม ไม่มีชื่อโรค (ไม่ระบุชื่อยาหรือโรคที่เกี่ยวข้อง)\n- ✅ ข้อความ \"ผลิตภัณฑ์เสริมอาหาร...\" — ไม่ต้องใส่ เพราะไม่ใช่โพสต์ขาย (ไม่มีสินค้า ราคา หรือการชวนซื้อ)\n- ✅ ย่อหน้าแรกจบใจความก่อน See more (บอกครบว่าโพสต์นี้ตอบ 3 คำถามอะไร) · มี CTA เดียว คือทักแชท\n- ✅ เรื่องทานคู่กับยา → ชวนปรึกษาเภสัชกร ไม่ได้ตอบเอง · ตัวเลขทุกตัวมีแหล่งที่มา\n\n---\n\n### FB-2 · แคลเซียมสูตรใหม่จาก VitaDemo ข้อมูลบนฉลากครบ มีเลข อย. ตรวจสอบได้\n**Pillar:** P2 เลือกเป็น อ่านฉลากเป็น · **Funnel:** Do · **วันโพสต์:** อ. 1 ธ.ค. (วันเปิดตัว) · **ประเภท:** โพสต์ขาย\n\n> แคลเซียมสูตรใหม่ของ VitaDemo พร้อมแล้วค่ะ ตั้งใจทำให้คุณพ่อคุณแม่วัย 40+ ข้อมูลบนฉลากครบ มีเลข อย. ให้คุณตรวจสอบเองได้ทุกกระปุกค่ะ\n>\n> ก่อนซื้อแคลเซียมทุกยี่ห้อ เราอยากให้คุณดู 4 จุดนี้บนฉลากค่ะ\n> • ชนิดแคลเซียม: `[ชนิดแคลเซียม]`\n> • ปริมาณแคลเซียมต่อ `[เม็ด/ซอง]`: `[ปริมาณ]`\n> • วิธีทาน: `[วิธีทานตามฉลาก]`\n> • เลข อย.: `[เลข อย.]`\n>\n> ขนาด `[ขนาด]` · ราคา `[ราคา]`\n>\n> เช็กเลข อย. ได้เองในแอป ORYOR Smart Application หรือที่ www.fda.moph.go.th ค่ะ\n>\n> อยากดูฉลากตัวจริง หรือทานยาประจำอยู่และอยากให้เภสัชกรดูให้ก่อนสั่ง ทักแชทมาได้เลยค่ะ\n>\n> *ผลิตภัณฑ์เสริมอาหาร ไม่มีผลในการป้องกันหรือรักษาโรค*\n\nที่มา: วิธีเช็กเลข อย. = S12 ใน Lab 3 · ทุกตัวเลขของสินค้ารอข้อมูลใน `data/products.csv`\n\n**เช็กลิสต์ brand-voice**\n- ✅ ไม่มีคำในรายการห้าม ไม่มีชื่อโรค ไม่สัญญาผล ไม่มีคำว่าดีที่สุด/100%\n- ✅ มีข้อความ \"ผลิตภัณฑ์เสริมอาหาร ไม่มีผลในการป้องกันหรือรักษาโรค\"\n- ✅ ย่อหน้าแรกจบใจความ (สินค้าอะไร สำหรับใคร จุดเด่นที่ตรวจสอบได้) · มี CTA เดียว คือทักแชท\n- ✅ ไม่แต่งตัวเลข: ชนิด ปริมาณ ขนาด ราคา และเลข อย. เป็นตัวแทน `[...]` ทั้งหมด · เรื่องยา → เภสัชกร\n\n---\n\n### FB-3 · วันพ่อปีนี้ ส่งแคลเซียมสูตรใหม่พร้อมการ์ดถึงบ้านคุณพ่อ\n**Pillar:** P3 ส่งความใส่ใจถึงคุณพ่อคุณแม่ · **Funnel:** Do · **วันโพสต์:** พฤ. 3 ธ.ค. · **ประเภท:** โพสต์ขาย\n\n> วันพ่อปีนี้อยู่ไกลบ้าน ก็ยังส่งความใส่ใจไปถึงท่านได้ค่ะ ชุดของขวัญแคลเซียมสูตรใหม่ของ VitaDemo มาพร้อมการ์ดที่คุณเขียนข้อความถึงคุณพ่อได้เอง เราแพ็กให้และส่งตรงถึงบ้านท่านค่ะ\n>\n> ในชุดมี: แคลเซียมสูตรใหม่ `[ขนาด]` + การ์ดข้อความ · ราคา `[ราคา]`\n> ฉลากมีเลข อย. `[เลข อย.]` ท่านตรวจสอบเองได้ค่ะ\n>\n> สั่งภายใน `[วันตัดรอบส่งก่อนวันพ่อ]` เพื่อให้ถึงมือท่านทันวันพ่อ\n>\n> ถ้าคุณพ่อทานยาประจำอยู่ บอกเราตอนสั่งได้เลยค่ะ เภสัชกรจะช่วยดูให้ก่อน\n>\n> ทักแชทบอกชื่อคุณพ่อกับข้อความบนการ์ดได้เลยค่ะ แอดมินจะช่วยจัดชุดให้\n>\n> *ผลิตภัณฑ์เสริมอาหาร ไม่มีผลในการป้องกันหรือรักษาโรค*\n\nที่มา: มุมเล่าจากรีวิว \"ซื้อเป็นของขวัญให้ผู้ใหญ่\" (31 รายการตาม Lab 3) · ก่อนโพสต์ต้องเช็กว่าทีมแพ็กพร้อม เพราะ Lab 3 พบรีวิวส่งสินค้าผิด 11 รายการและกล่องบุบ 4 รายการ\nหมายเหตุ: ไม่มีข้อมูลรอบขนส่งใน `data/` จึงใช้ตัวแทนวันตัดรอบ\n\n**เช็กลิสต์ brand-voice**\n- ✅ ไม่มีคำในรายการห้าม ไม่มีชื่อโรค ไม่ทำให้กลัวเรื่องอายุ ไม่เร่งกดดันแบบ \"หมดแล้วหมดเลย\"\n- ✅ มีข้อความ \"ผลิตภัณฑ์เสริมอาหาร ไม่มีผลในการป้องกันหรือรักษาโรค\"\n- ✅ ย่อหน้าแรกจบใจความ (ของขวัญอะไร มีการ์ด ส่งถึงบ้าน) · มี CTA เดียว คือทักแชท (บรรทัดเรื่องยาไม่ใช่ CTA ที่สอง แต่ให้แจ้งในแชทเดียวกัน)\n- ✅ ราคา ขนาด เลข อย. วันตัดรอบ เป็นตัวแทน `[...]` · เรื่องยา → เภสัชกร\n\n---\n\n## 4. ข้อความ LINE OA 2 ข้อความ\n\n### LINE-1 · ชวนดูไลฟ์เภสัชกรตอบเรื่องแคลเซียม\n**Pillar:** P1 ถามเภสัชกร · **Funnel:** Think · **ส่ง:** จ. 7 ธ.ค. · **รูปแบบ:** Card message · **ประเภท:** ให้ความรู้ (ไม่ใช่ข้อความขาย)\n**กลุ่มผู้รับ:** อายุ 50+\n\n> ส่งถึงเพื่อนวัย 50+ เพราะพุธนี้เภสัชกรจะตอบเรื่องแคลเซียมสดค่ะ\n> ทานตอนไหนดี วันละเท่าไหร่ ทานคู่กับยาได้ไหม\n> ฝากคำถามไว้ก่อนได้ ไลฟ์ พ. 9 ธ.ค. 2 ทุ่มค่ะ\n>\n> **[ปุ่ม] ตั้งเตือนดูไลฟ์**\n\n**ทำไมเลือกกลุ่มนี้:** \"อายุ 50+ × Card message\" บล็อก 0.44% (71 จาก 16,240) ราวครึ่งหนึ่งของ \"ทั้งหมด × Rich message\" (0.86%) และ CTR 11.48% สูงกว่าการส่งถึงทุกคนแบบ Rich message (6.78%) ส่วนไลฟ์ที่ส่งถึงทุกคนแบบ Rich video ทำยอดขายต่อการส่งได้สูงกว่า (21.22฿) แต่บล็อก 0.56% และข้อความนี้ไม่ได้ขายของ จึงให้น้ำหนักกับอัตราบล็อกที่ต่ำกว่า กลุ่ม 50+ ยังตรงกับคำถามที่ Lab 3 พบ (คำแนะนำปริมาณของกรมอนามัยสำหรับอายุ 51 ปีขึ้นไป)\n\n**เช็กลิสต์ brand-voice**\n- ✅ ไม่มีคำในรายการห้าม ไม่มีชื่อโรค\n- ✅ ข้อความ \"ผลิตภัณฑ์เสริมอาหาร...\" — ไม่ต้องใส่ เพราะไม่ใช่ข้อความขาย\n- ✅ บรรทัดแรกบอกเหตุผลที่ส่ง · สั้น 3 บรรทัด · ปุ่มเดียว · ระบุกลุ่มผู้รับ\n- ✅ เรื่องยาจะให้เภสัชกรตอบในไลฟ์ แอดมินไม่ตอบเอง\n\n---\n\n### LINE-2 · ชุดของขวัญวันพ่อ สำหรับลูกค้าประจำ\n**Pillar:** P3 ส่งความใส่ใจถึงคุณพ่อคุณแม่ · **Funnel:** Do · **ส่ง:** พ. 2 ธ.ค. · **รูปแบบ:** Coupon · **ประเภท:** ข้อความขาย\n**กลุ่มผู้รับ:** ลูกค้า VIP\n\n> ขอบคุณที่เป็นลูกค้าประจำ เราจึงส่งสิทธิ์วันพ่อให้คุณก่อนค่ะ\n> ชุดของขวัญแคลเซียมสูตรใหม่ พร้อมการ์ดถึงคุณพ่อ ส่งตรงถึงบ้านท่าน\n> `[สิทธิ์ลูกค้าประจำ]` · ราคา `[ราคา]` · ถึงวันที่ `[วันหมดสิทธิ์]`\n> ผลิตภัณฑ์เสริมอาหาร ไม่มีผลในการป้องกันหรือรักษาโรค\n>\n> **[ปุ่ม] ใช้สิทธิ์สั่งชุดของขวัญ**\n\n**ทำไมเลือกกลุ่มนี้:** \"ลูกค้า VIP × Coupon\" บล็อก 0.34% (134 จาก 39,864 จาก 7 ครั้ง) ต่ำกว่าการส่งถึงทุกคน (0.72%) และมี CTR 14.59% กับยอดขายต่อการส่ง 21.95฿ สูงที่สุดในทุกกลุ่ม ส่วนกลุ่ม \"หญิง 40+\" ที่เคยรับข้อความของขวัญวันแม่ (Rich message) บล็อกต่ำ (0.41%) แต่ CTR 6.02% และยอดขายต่อการส่ง 5.77฿ ต่ำสุด จึงไม่เลือก\nประเภท Coupon เลือกเพราะเป็นประเภทที่บล็อกต่ำสุด (0.30%) แต่ `data/` ยังไม่มีสิทธิ์หรือโปรของแคมเปญนี้ ต้องให้ทีมกำหนดก่อน ถ้าไม่มีคูปองจริง ให้เปลี่ยนเป็น Card message และตัดบรรทัดสิทธิ์ออก\n\n**เช็กลิสต์ brand-voice**\n- ✅ ไม่มีคำในรายการห้าม ไม่มีชื่อโรค ไม่เร่งกดดัน\n- ✅ มีข้อความ \"ผลิตภัณฑ์เสริมอาหาร ไม่มีผลในการป้องกันหรือรักษาโรค\"\n- ✅ บรรทัดแรกบอกเหตุผลที่ส่ง · สั้น · ปุ่มเดียว · ระบุกลุ่มผู้รับ\n- ✅ สิทธิ์ ราคา วันหมดสิทธิ์ เป็นตัวแทน `[...]` ไม่ได้แต่งตัวเลข\n\n---\n\n## 5. ตัวแทนที่ต้องเติมก่อนเผยแพร่\n\n| ตัวแทน | ใช้ใน | ต้องได้จาก |\n|---|---|---|\n| `[ชนิดแคลเซียม]` `[ปริมาณ]` `[เม็ด/ซอง]` `[วิธีทานตามฉลาก]` | FB-2 | ฉลากจริง / `data/products.csv` |\n| `[ขนาด]` `[ราคา]` | FB-2, FB-3, LINE-2 | `data/products.csv` |\n| `[เลข อย.]` | FB-2, FB-3 | ทะเบียน อย. ของสินค้า |\n| `[วันตัดรอบส่งก่อนวันพ่อ]` | FB-3 | ทีมคลังสินค้า/ขนส่ง |\n| `[สิทธิ์ลูกค้าประจำ]` `[วันหมดสิทธิ์]` | LINE-2 | ทีมโปรโมชัน (ยังไม่มีใน data/) |\n| `[โปร 12.12]` | แผน #15, #16 | ทีมโปรโมชัน (ยังไม่มีใน data/) |\n\n**สิ่งที่ต้องเตรียมก่อนเริ่มแผน (จาก Lab 3):** ทุกโพสต์ชวนทักแชท แต่มีรีวิว \"แอดมินตอบช้า\" 9 รายการ จึงต้องจัดคนตอบแชทและเภสัชกรให้พอในวันที่ 1, 3, 9 และ 11 ธ.ค. · ต้องอบรมตัวแทนขายไม่ให้พูดว่าสินค้ารักษาโรค (มีรีวิวแบบนี้ 9 รายการ)\n", "lab5prompt": "# Lab 5 · Image prompt สำหรับ FB-1 (ร่างโดย creative)\n\n**โพสต์ต้นทาง:** FB-1 \"3 คำถามเรื่องแคลเซียม ที่เภสัชกรได้ยินบ่อยจากคนวัย 40+\" (P1 ถามเภสัชกร · See) จาก `output/lab4-content-plan.md`\n**ใช้กับ:** ChatGPT (สร้างภาพ) · ขนาดสี่เหลี่ยมจัตุรัส 1:1\n\n## Prompt (คัดลอกไปวางใน ChatGPT)\n\n```\nCreate a square 1:1 photograph-style image for a Facebook post.\n\nScene: a calm, sunlit Thai home kitchen table in the morning. On the right half of the frame:\na glass of milk, a small bowl of tofu and leafy greens, a few small sesame seeds on a wooden\nboard, a ceramic mug, and three blank pastel paper cards loosely fanned out with a pen beside\nthem (the cards are completely blank). In the soft-focus background, the hands of a Thai woman\nin her early 50s gently pouring tea — face not visible, only hands and forearms.\n\nMood: warm, trustworthy, everyday, unhurried. Natural window light from the right,\nsoft shadows, shallow depth of field. Color palette: warm cream, soft white, light wood,\nwith a few small deep-red accents (e.g., a red ceramic mug).\n\nComposition: keep the LEFT 45% of the image and the TOP 20% as clean, uncluttered,\nsoftly blurred negative space (plain cream wall / out-of-focus background) so a Thai\nheadline can be placed there later.\n\nStrict rules:\n- No text, letters, numbers, logos, labels or brand names anywhere in the image (cards are blank).\n- No supplement bottles, pills or product packaging.\n- No faces of real people, celebrities, doctors or pharmacists; no white coats or stethoscopes.\n- No hospital, clinic, medical equipment, X-rays, bones or anything suggesting illness or treatment.\n- Photorealistic, high quality, not illustrated.\n```\n\n## ตำแหน่งวางข้อความไทย\n- **หัวข้อหลัก:** ซ้ายบน ในพื้นที่ว่างด้านซ้าย 45% ของภาพ ชิดซ้ายและเว้นขอบราว 6%\n- **บรรทัดรอง / ชื่อแบรนด์:** ซ้ายล่าง เหนือขอบล่างราว 8%\n- ใช้ตัวอักษรสีน้ำตาลเข้มหรือแดงเข้มบนพื้นครีม ตัวหนาและใหญ่ อ่านง่ายสำหรับวัย 40+\n\n## เช็คกับ brand-voice\n- ✅ ไม่มีตัวหนังสือในภาพ · ไม่มีใบหน้าคนดังหรือพรีเซนเตอร์ · ไม่ใช้ภาพเภสัชกรถือสินค้า (ข้อห้ามข้อ 4)\n- ✅ ไม่สื่อว่ารักษาโรค (ไม่มีโรงพยาบาล ยา กระดูก หรือภาพเอกซเรย์) · ใช้อาหารในชีวิตประจำวันตามข้อ 2 ของโพสต์\n- ✅ เว้นพื้นที่สำหรับข้อความไทย และบอกตำแหน่งไว้แล้ว\n\n## ขั้นต่อไป (คุณทำเอง)\n1. วาง prompt ข้างบนใน ChatGPT แล้วสร้างภาพ\n2. ดาวน์โหลดภาพมาไว้ในโฟลเดอร์ `output/` (เช่น `output/fb1-calcium.png`)\n3. บอกชื่อไฟล์ แล้วจะทำ Prompt 2 ต่อ: ประกอบเป็นโพสต์ 1080×1080 → `output/lab5-post.html`\n", "lab6": "# Lab 6 · สรุปงาน CRM (Leads + RFM) · VitaDemo\n\n> ข้อมูลจำลองทั้งหมด · ตัวเลขทุกตัวคำนวณด้วย `lab6_crm.py` จาก `data/leads_raw.csv`, `data/customers.csv`, `data/sales_2025.csv`\n> ไฟล์ผลงาน: `output/lab6-leads.csv` (รายชื่อทำงาน 420 แถว) · `output/lab6-rfm.csv` (8,175 แถว ใช้ customer_id เท่านั้น)\n> รันซ้ำได้ด้วย `python lab6_crm.py`\n\n---\n\n## ส่วน A · Leads ใหม่\n\n### 1) จำนวนก่อน/หลังแต่ละขั้น\n\n| ขั้น | จำนวน |\n|---|---:|\n| leads ดิบ (`leads_raw.csv`) | 475 |\n| ปรับรูปแบบเบอร์ + วันที่ (ไม่ตัดแถว) | 475 |\n| ตัดรายชื่อซ้ำออก | **−55** |\n| เหลือหลังคัดซ้ำ | **420** |\n| แยกเป็นร้านค้า (ช่องทางขายส่ง) | 63 |\n| ลูกค้ารายคน ที่นำไปจัดกลุ่ม | 357 |\n\n### 2) การปรับรูปแบบ\n- **เบอร์โทร** → `0XXXXXXXXX` (10 หลัก) · ในไฟล์ดิบมี 3 แบบ: `+66...` 86 รายการ, มีขีด `08X-XXX-XXXX` 114 รายการ, ถูกรูปแบบอยู่แล้ว 84 รายการ · ไม่มีเบอร์ 191 รายการ (ปล่อยว่าง) · ปรับแล้วไม่มีเบอร์ผิดรูปแบบเหลือ\n- **วันที่** → `YYYY-MM-DD` · ในไฟล์ดิบมี 3 แบบ: `2025-11-25 13:45` 158 รายการ, `29/11/2025 05:35` 175 รายการ, `29/11/2025` 142 รายการ (อ่านเป็น วัน/เดือน/ปี ค.ศ.) · ทุกวันที่อยู่ในช่วง 2025-11-01 ถึง 2025-11-29\n- **สินค้าที่สนใจ** มีทั้งรหัส SKU และชื่อไทยปนกัน → เพิ่มคอลัมน์ `product_sku` (น้ำมันปลา = VD-FO01, คอลลาเจน = VD-CL01)\n\n### 3) กฎคัดรายชื่อซ้ำ (ตัดออก 55 รายการ)\n1. ถ้ามีเบอร์ → เบอร์ที่ปรับแล้วตรงกัน = คนเดียวกัน (ตัด 35)\n2. ถ้าไม่มีเบอร์ → ชื่อ + จังหวัด + วันที่ + ข้อความ ตรงกันทั้งหมด = คนเดียวกัน (ตัด 20)\n   - ไม่ใช้แค่ \"ชื่อ + จังหวัด\" เพราะชื่อเล่นซ้ำกันได้ง่าย (เช่น ชื่อเดียวกันแต่คนละวัน คนละข้อความ) จะรวมคนต่างกันผิดตัว\n- เก็บแถวที่ `lead_id` น้อยสุดไว้ · บันทึกแหล่งที่มาทั้งหมดใน `all_sources` และรหัสที่รวมไว้ใน `merged_lead_ids`\n- ตรวจแล้ว: ไม่มีเบอร์ซ้ำ และไม่มีคู่ชื่อ+จังหวัด+วันที่+ข้อความซ้ำเหลือในไฟล์ผลงาน\n\n### 4) ร้านค้า (แยกเป็นกลุ่มขายส่ง) · 63 ร้าน\n- กฎ: แหล่งที่มาเป็น `Google Maps (ร้านขายยา)` **หรือ** ชื่อมีคำว่า ร้าน / เภสัช / ฟาร์มา / คลินิก **หรือ** ข้อความเป็น \"(ข้อมูลร้านจากแผนที่ ไม่มีข้อความ)\"\n- มี 4 ร้านที่ซ้ำมาจากแหล่งอื่น (TikTok / Facebook) ถูกรวมเข้ากับแถว Google Maps ตอนคัดซ้ำแล้ว\n- ไม่นำไปจัด 3 กลุ่ม · ส่งต่อทีมขายส่ง/ตัวแทน\n\n### 5) จัดกลุ่มลูกค้ารายคน (357 คน) · กฎจากข้อความ (ข้อแรกที่ตรงชนะ)\n\n| กลุ่ม | กฎ (คำในข้อความ) | จำนวน |\n|---|---|---:|\n| **พร้อมคุย** | ขอเลขบัญชี / จะสั่ง / อยากสั่ง / สั่งให้ (37) · ถามราคา ค่าส่ง ส่งด่วน มีโปร (32) · สนใจเป็นตัวแทน / ซื้อไปขายต่อ (18) | **87** |\n| **ต้องให้ข้อมูลก่อน** | ถามข้อมูลสินค้า: อย. รีวิว ต่างจากยี่ห้ออื่น เหมาะกับใคร ทานกี่เดือน มีขายใน 7-11 (125) · มีข้อกังวล: แพง / เคยใช้แล้วไม่เห็นผล (45) · ถามเรื่องทานคู่กับยา (18) | **188** |\n| **ยังไม่ตรงกลุ่ม** | ข้อความทั่วไป ไม่มีความต้องการชัด: 👍 ไลก์ๆ สวัสดีค่ะ ดูก่อนนะคะ | **82** |\n| รวม | | 357 |\n\n- `product_interest` ไม่ใช้เลื่อนกลุ่ม แต่เก็บไว้ให้แอดมินเลือกสินค้าที่จะคุย\n- ผู้สนใจเป็นตัวแทน/ขายต่อ (18) เป็นคนรายบุคคล จึงอยู่ในกลุ่มพร้อมคุย แต่ `next_action` = ส่งทีมตัวแทน\n\n### 6) ป้าย \"ส่งต่อเภสัชกร\" · 30 คน\n- กฎ: ข้อความพูดถึงการทานคู่กับยา ยาประจำตัว โรคประจำตัว การตั้งครรภ์/ให้นม การแพ้ หรือถามว่าคนอายุเท่านี้ทานได้ไหม\n- พบ 2 แบบ: ถามเรื่องทานคู่กับยาประจำตัว 18 คน (อยู่กลุ่มต้องให้ข้อมูลก่อน) · สั่งให้คุณแม่อายุ 72 ถามว่าทานได้ไหม 12 คน (อยู่กลุ่มพร้อมคุย แต่ต้องให้เภสัชกรตอบก่อนปิดการขาย)\n- **ไม่มีการร่างคำตอบเรื่องสุขภาพ** · แอดมินส่งข้อความรับเรื่องเท่านั้น (ดูข้อความด้านล่าง) แล้วให้เภสัชกรติดต่อกลับ\n\n---\n\n## ส่วน B · ลูกค้าเดิม (RFM)\n\n### 1) ข้อมูลที่ใช้\n| รายการ | จำนวน |\n|---|---:|\n| คำสั่งซื้อทั้งหมด (`sales_2025.csv`) | 16,613 |\n| คำสั่งซื้อสถานะ \"สำเร็จ\" (ใช้คำนวณ) | 15,591 |\n| ลูกค้าใน `customers.csv` | 8,431 |\n| ลูกค้าที่มีคำสั่งซื้อสำเร็จอย่างน้อย 1 ครั้ง (นำมาทำ RFM) | **8,175** |\n| ลูกค้าที่มีแต่คำสั่งซื้อยกเลิก/คืนสินค้า (ไม่นำมาคิด) | 256 |\n\n- **วันอ้างอิง** = 2026-01-01 (วันถัดจากคำสั่งซื้อล่าสุดในไฟล์ 2025-12-31)\n- Recency = จำนวนวันจากคำสั่งซื้อสำเร็จล่าสุดถึงวันอ้างอิง · Frequency = จำนวนคำสั่งซื้อสำเร็จ · Monetary = ผลรวม `net_amount_thb`\n\n### 2) เกณฑ์คะแนน (ค่าคงที่ ไม่ใช่ควินไทล์)\n| คะแนน | R (recency_days) | F (frequency) | M (monetary ฿) |\n|---|---|---|---|\n| 5 | ≤ 30 | ≥ 5 | ≥ 3,000 |\n| 4 | 31–60 | 4 | 1,900–2,999 |\n| 3 | 61–90 | 3 | 1,200–1,899 |\n| 2 | 91–180 | 2 | 700–1,199 |\n| 1 | > 180 | 1 | < 700 |\n\n### 3) เกณฑ์แบ่ง 4 กลุ่ม (ใช้ Recency × Frequency)\n| | ซื้อ ≥ 2 ครั้ง | ซื้อ 1 ครั้ง |\n|---|---|---|\n| **ซื้อล่าสุด ≤ 90 วัน** (R 3–5) | ลูกค้าประจำ | ลูกค้าใหม่ |\n| **ซื้อล่าสุด > 90 วัน** (R 1–2) | ลูกค้าที่เสี่ยงหาย | ลูกค้าที่เงียบไป |\n\nM ไม่ใช้แบ่งกลุ่ม แต่ใส่ไว้ในไฟล์ให้เลือกลูกค้ามูลค่าสูงในแต่ละกลุ่มได้\n\n### 4) ผลลัพธ์\n| กลุ่ม | จำนวนลูกค้า | % ลูกค้า | ยอดซื้อเฉลี่ย/คน (฿) | ซื้อเฉลี่ย (ครั้ง) | ห่างล่าสุดเฉลี่ย (วัน) | % ของยอดขาย |\n|---|---:|---:|---:|---:|---:|---:|\n| ลูกค้าประจำ | **2,604** | 31.9% | 3,141.8 | 3.0 | 36.0 | 50.8% |\n| ลูกค้าใหม่ | **1,283** | 15.7% | 1,049.7 | 1.0 | 40.3 | 8.4% |\n| ลูกค้าที่เสี่ยงหาย | **1,488** | 18.2% | 2,510.8 | 2.5 | 165.8 | 23.2% |\n| ลูกค้าที่เงียบไป | **2,800** | 34.3% | 1,019.6 | 1.0 | 222.5 | 17.7% |\n| รวม | 8,175 | 100% | | | | |\n\nข้อสังเกต: กลุ่มเสี่ยงหายมียอดซื้อต่อคนสูงรองจากกลุ่มประจำ และคิดเป็น 23.2% ของยอดขาย จึงควรดึงกลับเป็นอันดับแรก · ลูกค้าเป็นเพื่อน LINE ราว 55% ในทุกกลุ่ม (ส่วนที่เหลือต้องใช้ช่องทางที่ซื้อครั้งแรก)\n\n---\n\n## ข้อความติดต่อ (1 ข้อความต่อกลุ่ม · ตาม brand-voice)\n\n> ใช้ {ชื่อ} แทนชื่อลูกค้าจากไฟล์ทำงาน · ราคาอ้างอิง `data/products.csv` · ไม่ใส่โปรที่ไม่มีในข้อมูล\n\n### Leads\n\n**พร้อมคุย**\n> สวัสดีค่ะคุณ{ชื่อ} ขอบคุณที่สนใจ VitaDemo นะคะ\n> แอดมินสรุปราคา ค่าส่ง และวิธีสั่งให้ได้ทันที ทุกตัวมีเลข อย. ตรวจสอบได้ค่ะ\n> ตอบกลับแชทนี้ได้เลยนะคะ แอดมินรออยู่ค่ะ\n> *ผลิตภัณฑ์เสริมอาหาร ไม่มีผลในการป้องกันหรือรักษาโรค*\n\n**ต้องให้ข้อมูลก่อน**\n> สวัสดีค่ะคุณ{ชื่อ} เราสรุปข้อมูลสินค้าไว้ให้แล้วค่ะ ทั้งขนาด ราคา วิธีทาน และเลข อย.\n> มีรีวิวจากลูกค้าที่ทานต่อเนื่องให้ดูประกอบด้วยนะคะ\n> อยากให้ส่งข้อมูลตัวไหน พิมพ์ชื่อสินค้ามาในแชทได้เลยค่ะ\n> *ผลิตภัณฑ์เสริมอาหาร ไม่มีผลในการป้องกันหรือรักษาโรค*\n\n**ยังไม่ตรงกลุ่ม**\n> ขอบคุณที่แวะมาทักทายนะคะคุณ{ชื่อ}\n> ที่ LINE OA ของ VitaDemo มีเรื่องเล่าการดูแลสุขภาพในแต่ละวัน อ่านง่าย และมีไลฟ์คุยกับเภสัชกรค่ะ\n> กดเพิ่มเพื่อนไว้ได้เลยนะคะ\n\n**ป้าย \"ส่งต่อเภสัชกร\"** (ข้อความรับเรื่องเท่านั้น ไม่ตอบเรื่องสุขภาพ)\n> ขอบคุณที่สอบถามนะคะคุณ{ชื่อ}\n> เรื่องการทานร่วมกับยาหรือความเหมาะสมกับสุขภาพของแต่ละคน ขอให้เภสัชกรของเราเป็นผู้ให้คำแนะนำค่ะ\n> รบกวนแจ้งเวลาที่สะดวกให้เภสัชกรโทรกลับในแชทนี้ได้เลยนะคะ\n\n**ร้านค้า (ช่องทางขายส่ง)**\n> เรียนเจ้าของร้าน{ชื่อร้าน} ค่ะ VitaDemo มีผลิตภัณฑ์เสริมอาหาร 4 รายการ ทุกตัวมีเลข อย. ตรวจสอบได้\n> เรามีเงื่อนไขสำหรับร้านขายยาที่สนใจวางสินค้า\n> ตอบกลับข้อความนี้เพื่อนัดคุยกับทีมขายส่งได้เลยค่ะ\n> *ผลิตภัณฑ์เสริมอาหาร ไม่มีผลในการป้องกันหรือรักษาโรค*\n\n### ลูกค้าเดิม (RFM)\n\n**ลูกค้าประจำ**\n> ขอบคุณที่ไว้ใจให้ VitaDemo เป็นส่วนหนึ่งของการดูแลสุขภาพมาตลอดนะคะ\n> ถ้าของที่ทานอยู่ใกล้หมด บอกแอดมินไว้ล่วงหน้า เราเตรียมส่งให้ทานต่อเนื่องได้ไม่ขาดค่ะ\n> ทักแชทบอกชื่อสินค้าได้เลยนะคะ\n> *ผลิตภัณฑ์เสริมอาหาร ไม่มีผลในการป้องกันหรือรักษาโรค*\n\n**ลูกค้าใหม่**\n> ยินดีต้อนรับสู่ครอบครัว VitaDemo ค่ะ\n> ทานต่อเนื่องตามวิธีทานบนฉลากนะคะ ถ้ามีคำถามเรื่องการทาน เภสัชกรของเราพร้อมให้คำปรึกษาค่ะ\n> ทักแชทมาได้ทุกเมื่อเลยนะคะ\n> *ผลิตภัณฑ์เสริมอาหาร ไม่มีผลในการป้องกันหรือรักษาโรค*\n\n**ลูกค้าที่เสี่ยงหาย**\n> ไม่ได้คุยกันสักพักแล้วนะคะ ของที่เคยทานอยู่หมดหรือยังคะ\n> ถ้าอยากทานต่อ แอดมินช่วยเช็กสินค้าตัวเดิมและสรุปยอดให้ได้เลยค่ะ\n> พิมพ์ \"สั่งซ้ำ\" ในแชทนี้ได้เลยนะคะ\n> *ผลิตภัณฑ์เสริมอาหาร ไม่มีผลในการป้องกันหรือรักษาโรค*\n\n**ลูกค้าที่เงียบไป**\n> คิดถึงนะคะ ขอบคุณที่เคยเลือก VitaDemo ค่ะ\n> ตอนนี้เรามี Lutein Plus 690 บาท สำหรับคนทำงานหน้าจอทั้งวัน แคปซูลกลืนง่าย มีเลข อย. ค่ะ\n> ทักแชทขอรายละเอียดได้เลยนะคะ\n> *ผลิตภัณฑ์เสริมอาหาร ไม่มีผลในการป้องกันหรือรักษาโรค*\n\nเช็ก brand-voice แล้ว: ไม่มีคำห้าม/ชื่อโรค · CTA เดียวต่อข้อความ · ข้อความขายมีบรรทัด \"ผลิตภัณฑ์เสริมอาหาร...\" · ไม่สัญญาผลลัพธ์หรือระยะเวลา\n\n---\n\n## จุดที่ใช้ดุลยพินิจ\n1. คัดซ้ำกรณีไม่มีเบอร์ ใช้ชื่อ+จังหวัด+วันที่+ข้อความ (เข้มกว่าชื่อ+จังหวัด) เพื่อไม่รวมคนชื่อซ้ำที่เป็นคนละคน · ได้ 55 ซึ่งตรงกับที่ `data/README.md` ระบุไว้ (ราว 55)\n2. คำถาม \"สั่งให้คุณแม่อายุ 72 ทานวิตามินรวมได้ไหม\" ติดป้ายส่งต่อเภสัชกรด้วย เพราะเป็นคำถามความเหมาะสมกับสุขภาพเฉพาะคน แม้ไม่ได้พูดถึงยาตรง ๆ\n3. \"เคยใช้แล้วไม่เห็นผล\" และ \"แพงจัง\" จัดเป็นต้องให้ข้อมูลก่อน (มีความสนใจแต่มีข้อกังวล) ไม่ใช่ยังไม่ตรงกลุ่ม\n4. ผู้ถามเรื่องตัวแทน/ซื้อไปขายต่อ เป็นบุคคล จึงอยู่ในกลุ่มพร้อมคุย ไม่รวมกับร้านค้า\n5. \"ลูกค้าใหม่\" นิยามจากข้อมูลปี 2568 ที่มีเท่านั้น (ซื้อครั้งเดียวและภายใน 90 วัน) ไม่เห็นประวัติก่อนหน้านั้น\n6. สรุปนี้ไม่แสดงชื่อหรือเบอร์ลูกค้า · `lab6-rfm.csv` ใช้ customer_id เท่านั้น\n", "plan": "# แผนแคมเปญ · เปิดตัวแคลเซียมสูตรใหม่ VitaDemo (วัย 40+)\n\n> ข้อมูลจำลองเพื่อการอบรม · ทำโดยทีม 7 ตำแหน่ง (3 รอบ) · รวบรวม 27 พ.ย. 2569\n> ช่วงแคมเปญ: **จ. 30 พ.ย. – อา. 13 ธ.ค. 2569** (14 วัน · มีวันพ่อ 5 ธ.ค. และ 12.12)\n> สูตร ขนาด ราคา และเลข อย. ของแคลเซียมใหม่ **ยังไม่มีใน data/** ทุกจุดที่ต้องใช้จึงเว้นเป็น `[...]`\n\n## สรุปสำหรับผู้บริหาร (5 บรรทัด)\n1. **ไม่สู้ราคา:** คู่แข่ง 3 แบรนด์ขายแคลเซียมราว 200–430 บาท/กระปุก และมีช่องทางครบ *(Lab 2)*\n2. **ช่องว่างที่เราชนะได้:** ยังไม่พบคู่แข่งที่ให้ **เภสัชกรให้ความรู้และตอบคำถาม** (เภสัชกรไม่ถือหรือรับรองสินค้า) และแคมเปญล่าสุดของคู่แข่งมุ่งคนรุ่นใหม่ ส่วนเราคุยกับวัย 40+ โดยตรง *(Lab 2)*\n3. **Content 3 pillar:** ถามเภสัชกร 45% · อ่านฉลากเป็น 35% · ของขวัญพ่อแม่ 20% *(Lab 3)* แผน 18 ชิ้นใน 2 สัปดาห์ *(Lab 4)*\n4. **ลูกค้าเดิมก่อน:** ลูกค้าประจำอายุ 55+ 1,632 คน (เพื่อน LINE 876) และ VIP 45+ 1,025 คน ส่ง LINE แบบเลือกกลุ่มเท่านั้น *(CRM)*\n5. **งบโฆษณา (สมมติ) 140,000 บาท** ใช้รูปแบบโฆษณาที่พิสูจน์แล้วใน Lab 7 และหยุดโฆษณา Static ที่ขาดทุน *(งบ)*\n\n---\n\n## รอบ 1 · competitor-analyst + researcher\n\n| หัวข้อ | สาระสำคัญ | ไฟล์ |\n|---|---|---|\n| คู่แข่ง | Blackmores Bio Calcium+D3 · MEGA We care Calcium-D · VISTRA Bon-Activ / Calplex เทียบ 6 ด้าน (25 แหล่ง มีลิงก์และวันที่ค้น) | [lab2-comparison.html](lab2-comparison.html) |\n| ช่องที่ชนะได้ | ① เภสัชกรให้ความรู้ + ปรึกษาหลังการขาย (ไม่รับรองสินค้า) ② ความน่าเชื่อถือที่ตรวจได้ (เลข อย. — 32 รีวิวชม) สำหรับวัย 40+ ③ แพ็กของขวัญพ่อแม่ (31 รีวิว) | 〃 |\n| คำถามที่วัย 40+ ถามบ่อย | ทานตอนไหน/ชนิดไหน · ทานคู่ยาได้ไหม (→ เภสัชกร) · ไม่สบายท้อง/ทานมากไป · วันละเท่าไหร่ · ซื้อยี่ห้อไหนให้คุณแม่ | [lab3-pillars.html](lab3-pillars.html) |\n| Pillar | P1 ถามเภสัชกร 45% · P2 เลือกเป็น อ่านฉลากเป็น 35% · P3 ส่งความใส่ใจถึงคุณพ่อคุณแม่ 20% | 〃 |\n\n**ข้อจำกัด:** ราคา Watsons 2 รายการมาจากผลค้นหา (ยังไม่ได้เปิดหน้ายืนยัน) · ไม่มีข้อมูล Google Trends · Pillar 3 หลักฐานอ่อนสุด\n\n## รอบ 2 · content-writer + creative + crm-planner + data-analyst\n\n### 2.1 แผนคอนเทนต์ (content-writer) → [lab4-content-plan.md](lab4-content-plan.md)\n- 18 ชิ้น: FB 14 · LINE 4 · P1 8 / P2 6 / P3 4 · See 3 / Think 7 / Do 6 / Care 2\n- วันเปิดตัวที่เสนอ อ. 1 ธ.ค. · P3 ลงช่วงวันพ่อ · P2 (Do) ลงช่วง 12.12\n- FB-1 \"3 คำถามเรื่องแคลเซียมที่เภสัชกรได้ยินบ่อย\" · FB-2 เปิดตัว ฉลากครบ มีเลข อย. · FB-3 ของขวัญวันพ่อ\n- LINE-1 → ลูกค้า 45+ ตามแผน CRM (สถิติอ้างอิงจาก segment \"อายุ 50+\": บล็อก 0.44%, CTR 11.48% — ผลกับ 45+ อาจต่างไป) · LINE-2 → VIP (บล็อก 0.34%, CTR 14.59%, ยอด/การส่ง 21.95 บาท) · ไม่ส่งถึงเพื่อนทั้งหมด (บล็อก 0.72%)\n\n### 2.2 ครีเอทีฟ (creative) → [lab5-post.html](lab5-post.html)\n- ภาพ FB-1 สร้างใน ChatGPT จาก [lab5-image-prompt.md](lab5-image-prompt.md): โต๊ะอาหารเช้า นม เต้าหู้ ผักใบเขียว ไม่มีใบหน้า ไม่มีสินค้า\n- หัวข้อ 7 คำ \"3 คำถามแคลเซียม ที่เภสัชกรได้ยินบ่อย\" · โพสต์ 1080×1080\n- **ยังต้องทำ:** ภาพสำหรับ FB-2 และ FB-3 (ใช้ prompt แบบเดียวกัน)\n\n### 2.3 CRM (crm-planner) → [campaign-crm.md](campaign-crm.md)\n| ลำดับ | กลุ่ม | ลูกค้า | เพื่อน LINE | การติดต่อ |\n|---|---|---:|---:|---|\n| 1 | ลูกค้าประจำ 55+ | 1,632 | 876 | LINE-1 (จ. 7 ธ.ค.) + แจ้ง 12.12 (ศ. 11 ธ.ค.) |\n| VIP | VIP 45+ (ประจำ · ยอด ≥ 3,000 · รวม 45–54 ด้วย ไม่ใช่กลุ่มย่อยของลำดับ 1) | 1,025 | 542 | LINE-2 ของขวัญวันพ่อ (พ. 2 ธ.ค.) |\n| 2 | ลูกค้าประจำ 45–54 | 674 | 379 | LINE-1 + แจ้ง 12.12 |\n| 3 | เสี่ยงหาย 45+ | 1,293 | 710 | LINE-1 + แจ้ง 12.12 |\n| 4 | ลูกค้าใหม่ 45+ | 1,020 | 550 | ความรู้ P1 เท่านั้น |\n| 5 | เงียบไป 45+ | 2,199 | 1,211 | ไม่ส่ง LINE · เห็นแค่ FB |\n| เสริม | ซื้อของขวัญ 25–44 | 561 | 317 | LINE ย่อจาก FB-3 (พฤ. 3 ธ.ค.) — ตัดออกได้ |\n\n- Cross-sell: ผู้ซื้อ Multivitamin 50+ / Fish Oil 55+ ที่เป็นเพื่อน LINE 1,487 คน (ซ้อนกับลำดับ 1–3 · เปลี่ยนเนื้อหา ไม่ส่งเพิ่ม)\n- Leads: ติดต่อ 275 ราย · **คิวเภสัชกร 30 รายต้องทำก่อนข้อความขาย (วันที่ 1–3)** · ร้านขายยา 63 ร้าน = สายขายส่ง\n- ทุกคนได้ LINE broadcast ไม่เกิน 2 ครั้ง\n- ⚠️ RFM คิดจากยอดปี 2568 (อ้างอิง 1 ม.ค. 2569) ต้องรันใหม่ด้วยยอดล่าสุดก่อนส่งจริง\n\n### 2.4 งบโฆษณา (data-analyst) → [campaign-budget.md](campaign-budget.md)\n**งบรวม 140,000 บาท / 14 วัน `[สมมติฐาน]`** ฐานจริง 6,664 บาท/วัน (ก.ย.–พ.ย.) → +50% ช่วงเปิดตัว · CPM แพงขึ้น 14.1% จึงได้อิมเพรสชันเพิ่มราว 1.31 เท่า `[สมมติฐาน: CPM ธ.ค. = พ.ย.]`\n\n| รูปแบบ | Funnel · Pillar | สัดส่วน | งบ (บาท) |\n|---|---|---:|---:|\n| วิดีโอ 6s (Awareness) | See · P1/P3 | 17% | 23,800 |\n| วิดีโอเภสัชกรให้ความรู้ 30s (เภสัชกรไม่ถือ/ไม่แนะนำสินค้า · สินค้าและราคาอยู่ใน end card แยก) | Think→Do · P1 | 22% | 30,800 |\n| วิดีโอ 15s อ่านฉลาก | Do · P2 | 20% | 28,000 |\n| วิดีโอ 15s ของขวัญพ่อแม่ | Do · P3 | 12% | 16,800 |\n| วิดีโอรีวิว (มีเงื่อนไข: ไม่มีรีวิวจริงภายใน 7 ธ.ค. → ย้ายไปวิดีโอเภสัชกร) | Do · P2 | 8% | 11,200 |\n| DPA retarget | Do/Care | 5.5% | 7,700 |\n| Lead ปรึกษาเภสัชกร | Think/Care · P1 | 5% | 7,000 |\n| งบสำรอง (ปล่อยตามกฎ scale) | — | 10.5% | 14,700 |\n\n- สัดส่วน pillar ได้ P1 45.2% · P2 33.3% · P3 21.4% · **ไม่ใช้** Static 2 ตัวและ Carousel ตาม Lab 7\n- วันพีค: 3–4 ธ.ค. (ก่อนวันพ่อ) 12,114 บาท/วัน · **12.12 = 23,736 บาท**\n- **ผลที่คาด (ค่าประมาณ ไม่ใช่คำสัญญา):** 415–633 ออเดอร์ · ยอดขาย 429,000–654,000 บาท `[สมมติฐาน: ยอดต่อออเดอร์ 1,034 บาท · CPM ธ.ค. = พ.ย.]` · ROAS แอดยอดขาย 3.93–5.99 · แนะนำใช้กรณีระมัดระวังเป็นตัวเลขวางแผน\n- ทางเลือก: ประหยัด 95,000 → 282–429 ออเดอร์ · เต็มที่ 190,000 → 564–859 ออเดอร์ (คิดเส้นตรง งบสูงอาจดีเกินจริง)\n- **กฎหยุด/เพิ่ม:** หยุดเมื่อ ROAS < 1.57 (จุดคุ้มทุนหลังหักส่วนลด) ครบ 3 วัน · ลด 20% เมื่อ ROAS 1.57–3.93 · เพิ่ม 20% เมื่อ ROAS ≥ 3.93 และความถี่ < 2.5 · Awareness ดู CPM ≤ 44 บาท และ ThruPlay ≥ 18.3% · Lead ดูต้นทุนต่อลีด ≤ 107 บาท (ยอมได้ถึง 146)\n- **ช่องทาง:** LINE OA ได้เงินจริงต่อออเดอร์มากกว่า TikTok Shop 26% (ส่วนลด 8.1% vs 18.1% · ยกเลิก/คืน 1.4% vs 12.2%) → แอดเภสัชกรและ Lead พาเข้า LINE OA · ต้องติด UTM เพื่อวัดยอดจริง\n\n## รอบ 3 · auditor\n**ผล: ผ่านแบบมีเงื่อนไข** (ตรวจแบบอ่านอย่างเดียว · ตรวจซ้ำตัวเลขจาก data/ ด้วย Python)\n\nตัวเลขสำคัญเกือบทั้งหมดตรงกับ data/ · ชิ้นงานที่จะเผยแพร่ไม่มีคำห้าม ไม่มีชื่อโรค ไม่มีข้อมูลส่วนบุคคล · ข้อความขายที่เขียนเสร็จมี disclaimer ครบ\n\n**ต้องแก้ก่อนใช้จริง** (แก้ในแผนหลักและ Checklist ด้านล่างแล้ว)\n1. เภสัชกรต้องเป็นผู้ให้ความรู้ ไม่ใช่ผู้นำเสนอหรือรับรองสินค้า (ข้อห้าม brand-voice ข้อ 4) รวมถึงแอดวิดีโอเภสัชกร\n2. บังคับ disclaimer ในแอด Sales ทุกตัวและโพสต์ 12.12 ที่ยังไม่ได้เขียน\n3. รีวิวที่แอดมินส่งให้ leads ต้องไม่อ้างผล\n\n**ควรแก้** (แก้ในแผนหลักแล้ว: ตาราง VIP · LINE-1 ลำดับ 2 · ที่มาสถิติ LINE-1 · วันเพิ่มคนตอบแชท · ป้ายสมมติฐาน)\n- ไฟล์ย่อยยังมีจุดเล็ก: `campaign-crm.md` ช่วงเพื่อน LINE ควรเป็น 50.9%–64.0% (เขียน 51.7%) · `campaign-budget.md` แถววิดีโอรีวิวเฉลี่ย 1,867 บาท/วัน (เขียน 1,600) · เกณฑ์อัตราปิดลีดควรใช้จุดคุ้มทุน 1.57 ให้ตรงกันทั้งไฟล์ (≈16–22%)\n- FB-1 ข้อ 3 ประโยคเรื่องยาให้เภสัชกรอนุมัติ หรือตัดเหลือ \"ข้อนี้เภสัชกรขอดูเป็นรายคนค่ะ\"\n\n**ตัวเลขที่ตรวจซ้ำแล้วตรง ✅:** งบ Meta 6,664 บาท/วัน · CPM +14.1% · ROAS รายแอด · จุดคุ้มทุน 1.36–1.46 / 1.44–1.57 · ยอดต่อออเดอร์ 1,034 · LINE OA vs TikTok (8.1/18.1% · 1.4/12.2% · 1,084/859) · สถิติ LINE broadcast · ตัวเลขรีวิวทั้งหมด · RFM × อายุทุกกลุ่ม · cross-sell 1,487 · leads 87/188/82/63/30 · งบรวม 140,000 และ 12.12 = 23,736 · สัดส่วนแผน 18 ชิ้น\n**ไม่ตรง ❌:** 2 จุดในไฟล์ย่อยตามข้างบน\n\n---\n\n## สิ่งที่ต้องทำก่อนเริ่ม (Checklist)\n- [ ] เติมข้อมูลสินค้า: `[ชนิดแคลเซียม] [ปริมาณ] [ขนาด] [ราคา] [เลข อย.]` และโปร `[วันตัดรอบส่งวันพ่อ] [โปร 12.12]`\n- [ ] อบรมตัวแทนเรื่องห้ามอ้างรักษาโรค (9 รีวิวเล่าว่า \"คนขายบอกว่ารักษาเบาหวานได้\")\n- [ ] เพิ่มคนตอบแชทวันที่ **1, 2, 3, 9, 11, 12 ธ.ค.** และแยกคิวเภสัชกรออกจากคิวแอดมิน (9 รีวิวแอดมินตอบช้า)\n- [ ] **ใส่ \"ผลิตภัณฑ์เสริมอาหาร ไม่มีผลในการป้องกันหรือรักษาโรค\" ในแอด Sales ทุกตัว และโพสต์ 12.12 (#15 #16)** และให้ auditor ตรวจก่อนลง\n- [ ] ทำ **รายการรีวิวที่อนุมัติแล้ว** ให้แอดมินส่ง leads ได้เฉพาะรีวิวที่ไม่อ้างผล (เลข อย. ชัด · กลืนง่าย · ซองชงง่าย · แพ็กดี) ห้ามส่ง \"ตาไม่ล้าเท่าเดิม\" / \"รู้สึกสดชื่นขึ้น\"\n- [ ] แชทที่แจ้งอาการหลังทาน (เช่น คลื่นไส้ — 7 รีวิว) → คิว \"ส่งต่อเภสัชกร\" ทันที\n- [ ] ให้เภสัชกรจริงอนุมัติประโยคเรื่องยาใน FB-1 ข้อ 3 และเปิดเอกสารกรมอนามัยต้นทางยืนยันตัวเลข 1,000 มก./วัน\n- [ ] `lab6-leads.csv` ใช้ภายในเท่านั้น (มีชื่อ เบอร์ และคำถามสุขภาพรายคน) ห้ามแนบในงานที่แชร์ ห้ามอัปโหลดเป็น C  | 1,020 | 550 | 1,041.1 | 1.0 | 41.0 |\n| ลูกค้าที่เงียบไป | 2,199 | 1,211 | 1,016.4 | 1.0 | 222.3 |\n\n### 1.4 ลำดับช่องที่ควรเริ่มก่อน\n\n| ลำดับ | ช่อง (กลุ่ม × อายุ) | ลูกค้า | เพื่อน LINE | เหตุผล |\n|---|---|---:|---:|---|\n| 1 | **ลูกค้าประจำ × 55-64 และ 65+** | 1,632 | 876 | ช่วงอายุที่ซื้อซ้ำสูงสุด (54.2% / 59.9%) ในกลุ่มที่ซื้อต่อคนสูงสุด (ประจำ 45+ เฉลี่ย 3,215.9฿) |\n| 1a | ในนั้น \"VIP\" = ประจำ และ M = 5 (ยอดซื้อ ≥ 3,000฿) อายุ 45+ | 1,025 | 542 | ใช้รับ LINE-2 (Coupon) ตาม Lab 4 · นิยาม VIP นี้เป็นของแผนนี้ เทียบกับกลุ่ม \"ลูกค้า VIP\" ใน LINE OA ก่อนส่ง |\n| 2 | **ลูกค้าประจำ × 45-54** | 674 | 379 | ยังซื้ออยู่ (ห่างล่าสุดเฉลี่ย 35.9 วันในกลุ่มประจำ 45+) และอยู่ในวัย 40+ |\n| 3 | **ลูกค้าที่เสี่ยงหาย × 45+** | 1,293 | 710 | ยอดซื้อต่อคนสูงรองจากกลุ่มประจำ (2,518.1฿) · เปิดตัวสินค้าใหม่เป็นเหตุผลที่ดีในการทักกลับ |\n| 4 | ลูกค้าใหม่ × 45+ | 1,020 | 550 | ซื้อครั้งเดียว ใช้ให้ความรู้ (P1) ก่อนชวนซื้อ |\n| 5 | ลูกค้าที่เงียบไป × 45+ | 2,199 | 1,211 | ห่างล่าสุดเฉลี่ย 222.3 วัน ยอดต่อคนต่ำสุด · ไม่ส่ง LINE แยก ให้เห็นแค่โพสต์ FB ตามแผน Lab 4 เพื่อลดการบล็อก |\n| เสริม | ประจำ + ใหม่ × 25-44 (กลุ่มซื้อของขวัญ P3) | 561 | 317 | ซื้อให้คุณพ่อคุณแม่ช่วงวันพ่อ · รีวิว \"ซื้อเป็นของขวัญให้ผู้ใหญ่\" 31 รายการ และ \"ซื้อให้คุณแม่ทานต่อเนื่อง\" 26 รายการ |\n\n- ถ้าต้องการกลุ่ม \"อายุ 50+\" แบบเข้มงวด (55-64 + 65+) ที่เป็นเพื่อน LINE: รวมทุกกลุ่ม RFM = **2,392 คน** · เฉพาะประจำ 876 · เสี่ยงหาย 468 · ใหม่ 308 · เงียบไป 740\n- **ลำดับ 1–3 ที่ไม่ได้เป็นเพื่อน LINE มี 1,634 คน** (ประจำ 1,051 · เสี่ยงหาย 583) แยกตามช่องทางที่ซื้อครั้งแรก: Shopee 467 · LINE OA 348 · TikTok Shop 309 · Facebook 276 · Lazada 234 → ใช้โพสต์ FB-2/FB-3 และหน้าร้านของแต่ละ marketplace แทน (ส่วน 348 คนที่มาจาก LINE OA แต่ตอนนี้ไม่เป็นเพื่อนแล้ว ไม่ควรตามด้วยช่องทางอื่นแบบเจาะจง)\n- ลูกค้า 45+ ในกลุ่มประจำและเสี่ยงหายที่มาจากตัวแทน (`referred_by_agent` ไม่ใช่ \"ไม่มี\") มี **993 คน** → ให้ตัวแทนแจ้งข่าวได้ แต่ต้องอบรมคำพูดก่อน (ดูข้อ 5)\n\n---\n\n## 2. มุม Cross-sell: ผู้ซื้อสินค้าตัวไหนเกี่ยวข้องที่สุด\n\nนับลูกค้า (ไม่ซ้ำคน) ที่มีคำสั่งซื้อ \"สำเร็จ\" ของแต่ละ SKU ในปี 2568\n\n| สินค้า | ผู้ซื้อทั้งหมด | อายุ 45+ | 45+ ที่เป็นเพื่อน LINE | อายุ 55+ | 55+ ที่เป็นเพื่อน LINE |\n|---|---:|---:|---:|---:|---:|\n| **Multivitamin 50+ (VD-MV50)** | 2,773 | 2,372 | 1,266 | 1,565 | 818 |\n| **Fish Oil 1000 mg (VD-FO01)** | 3,545 | 3,014 | 1,663 | 2,006 | 1,104 |\n| Collagen Tripeptide (VD-CL01) | 3,641 | 3,126 | 1,709 | 2,112 | 1,147 |\n| Lutein Plus (VD-LT01) | 2,821 | 2,426 | 1,303 | 1,626 | 864 |\n\n**กลุ่ม cross-sell ที่แนะนำ = ผู้ซื้อ Multivitamin 50+ (ทุกอายุ) รวมกับผู้ซื้อ Fish Oil อายุ 55+**\n- Multivitamin 50+ วางตัวเป็นสินค้าวัยผู้ใหญ่อยู่แล้ว ผู้ซื้อ 85.5% (2,372 จาก 2,773) อายุ 45+ · Fish Oil ผู้ซื้อ 55+ เป็นกลุ่มที่ดูแลสุขภาพประจำวันต่อเนื่อง\n- รวมสองกลุ่ม (ตัดคนซ้ำ 590 คนที่ซื้อทั้งคู่) = **4,189 คน** · เป็นเพื่อน LINE **2,277 คน**\n\n| กลุ่ม RFM | กลุ่ม cross-sell | เป็นเพื่อน LINE |\n|---|---:|---:|\n| ลูกค้าประจำ | 1,809 | 968 |\n| ลูกค้าที่เสี่ยงหาย | 961 | 519 |\n| ลูกค้าใหม่ | 427 | 238 |\n| ลูกค้าที่เงียบไป | 992 | 552 |\n\n- ใช้เฉพาะ **ประจำ + เสี่ยงหาย ที่เป็นเพื่อน LINE = 1,487 คน** เป็นข้อความเวอร์ชัน cross-sell (คนกลุ่มนี้ซ้อนกับลำดับ 1–3 ในข้อ 1 ไม่ได้ส่งเพิ่ม แต่เปลี่ยนเนื้อหา)\n- **มุมเล่า:** ไม่บอกว่า \"ทานคู่กันดี\" แต่ชวนถามเภสัชกรก่อน เพราะวิตามินรวมบางสูตรมีแคลเซียมอยู่แล้ว และการทานร่วมกันเป็นคำถามเฉพาะคน → เข้า Pillar P1 และติดป้าย \"ส่งต่อเภสัชกร\" เมื่อลูกค้าถามเรื่องนี้\n- Collagen มีผู้ซื้อ 45+ มากที่สุด (3,126) แต่เชื่อมกับแคลเซียมได้อ่อนกว่า จึงไม่ทำข้อความ cross-sell แยก ให้อยู่ในข้อความกลุ่ม RFM ปกติ\n\n---\n\n## 3. จัดการ Leads ระหว่างแคมเปญ (จาก `lab6-leads.csv` 420 รายการ)\n\n| คิว | จำนวน | ทำอะไร |\n|---|---:|---|\n| **พร้อมคุย** | **87** | แอดมินติดต่อภายใน 24 ชม. 57 · ส่งทีมตัวแทน (สนใจเป็นตัวแทน/ขายต่อ) 18 · ส่งต่อเภสัชกรก่อนปิดการขาย 12 |\n| **ต้องให้ข้อมูลก่อน** | **188** | ส่งข้อมูลสินค้า เลข อย. รีวิว แล้วติดตาม 170 (ถามข้อมูลสินค้า 125 · มีข้อกังวลเรื่องราคา/เคยใช้แล้ว 45) · ส่งต่อเภสัชกร 18 |\n| รวมที่ต้องติดต่อ | **275** | แอดมินดูแล 245 · เภสัชกรดูแล 30 · มีเบอร์ 161 คน ที่เหลือตอบกลับทางช่องทางเดิม (คอมเมนต์/inbox) |\n| **คิวส่งต่อเภสัชกร** | **30** | ถามเรื่องทานคู่กับยาประจำตัว 18 + ถามว่าผู้สูงอายุทานได้ไหม 12 · มาจาก FB comment 8 · TikTok comment 8 · งานบูธ 7 · FB inbox 5 · LINE OA chat 2 · **แอดมินส่งข้อความรับเรื่องเท่านั้น ห้ามตอบเรื่องสุขภาพ** |\n| ยังไม่ตรงกลุ่ม | 82 | ไม่ส่งข้อความขาย · ชวนเป็นเพื่อน LINE OA เพื่อรับ LINE-1 (ไลฟ์เภสัชกร) |\n\n- ช่องทางที่มาของคิว \"พร้อมคุย + ต้องให้ข้อมูลก่อน\" (275): งานบูธ Health Expo 66 · LINE OA chat 53 · FB inbox 52 · TikTok comment 57 · FB comment 47\n- Leads ทุกรายเคยสนใจสินค้าเดิม (ไม่มีใครถามเรื่องแคลเซียม เพราะยังไม่เปิดตัว) จึงเปิดด้วย \"ขอบคุณที่เคยสนใจ\" แล้วค่อยแนะนำสูตรใหม่ ไม่ทำเหมือนเขาถามเรื่องนี้มา\n- **ร้านค้า 63 ร้าน (Google Maps ร้านขายยา · มีเบอร์ 38 ร้าน) → แยกเป็นสายขายส่ง ทีมขายส่งเสนอแคลเซียมสูตรใหม่พร้อมเงื่อนไขวางสินค้า `[เงื่อนไขขายส่ง]` ไม่รวมในข้อความลูกค้ารายคน**\n\n---\n\n## 4. ลำดับการติดต่อแต่ละกลุ่ม\n\nใช้ข้อความจาก Lab 4 ซ้ำให้มากที่สุด · LINE broadcast ทุกครั้งเลือกกลุ่ม ไม่ส่งถึงเพื่อนทั้งหมด (Lab 4: ส่งแบบเลือกกลุ่มบล็อก 0.39% เทียบกับส่งทั้งหมด 0.72%) · แต่ละคนรับ LINE broadcast ไม่เกิน 2 ครั้งในแคมเปญ\n\n**ก่อนเริ่ม (ศ. 27 – อา. 29 พ.ย.)** รัน RFM ใหม่ด้วยยอดขายปี 2569 · สร้าง audience ใน LINE OA จากรายการ customer_id ของแต่ละกลุ่ม · เติมตัวแทน `[...]` · จัดเวรแอดมินและเภสัชกร (ข้อ 5)\n\n| กลุ่ม | จำนวน (เพื่อน LINE) | วันที่ในแคมเปญ | ช่องทาง | Pillar / ข้อความที่ใช้ | CTA เดียว |\n|---|---:|---|---|---|---|\n| **A · VIP 45+** (ประจำ M=5) | 542 | วันที่ 3 · พ. 2 ธ.ค. | LINE Coupon | P3 · **LINE-2** ชุดของขวัญวันพ่อ (ใช้ตามเดิม) | ใช้สิทธิ์สั่งชุดของขวัญ |\n| | | วันที่ 8 · จ. 7 ธ.ค. | LINE Card | P1 · **LINE-1** ไลฟ์เภสัชกร (เฉพาะคนที่อยู่ใน audience 50+) | ตั้งเตือนดูไลฟ์ |\n| **B · ประจำ 45+ ที่ไม่ใช่ VIP** | 713 | วันที่ 8 · จ. 7 ธ.ค. | LINE Card | P1 · **LINE-1** · คนที่ซื้อ MV50/Fish Oil ใช้ **เวอร์ชัน cross-sell (ข้อความ M1)** | ตั้งเตือนดูไลฟ์ / ทักแชทถามเภสัชกร |\n| ้องกันหรือรักษาโรค\n\n**L2 · Leads ต้องให้ข้อมูลก่อน** (170 คน · P2 · ข้อความขาย)\n> สวัสดีค่ะคุณ{ชื่อ} ขอบคุณที่เคยสอบถามข้อมูลกับ VitaDemo นะคะ\n> เราเพิ่งเปิดตัวแคลเซียมสูตรใหม่ และทำสรุปฉลากไว้ให้อ่านง่าย 4 จุด: ชนิดแคลเซียม ปริมาณ วิธีทาน และเลข อย.\n> ถ้าทานยาประจำอยู่ เภสัชกรของเราช่วยดูให้ก่อนได้ค่ะ\n> พิมพ์ \"ขอฉลาก\" ในแชทนี้ เราส่งให้ทันทีค่ะ\n> ผลิตภัณฑ์เสริมอาหาร ไม่มีผลในการป้องกันหรือรักษาโรค\n\n**เช็กลิสต์ brand-voice (ทุกข้อความข้างบน)**\n- ✅ ไม่มีคำในรายการห้าม (รักษา บรรเทา ดีที่สุด 100% เห็นผลทันที ฯลฯ) ไม่มีชื่อโรค ไม่สัญญาผลลัพธ์ ไม่พูดถึงอาการ\n- ✅ ข้อความขาย (M2 M3 L1 L2) มี \"ผลิตภัณฑ์เสริมอาหาร ไม่มีผลในการป้องกันหรือรักษาโรค\" · M1 เป็นข้อความให้ความรู้ ไม่มีราคา/การชวนซื้อ\n- ✅ CTA เดียวต่อข้อความ (บรรทัดเรื่องยาใน M3/L2 ให้บอกในแชทเดียวกัน ไม่ใช่ CTA ที่สอง)\n- ✅ เรื่องทานคู่กับยา/วิตามินรวม → เภสัชกรตอบ ไม่ตอบเอง · ไม่เร่งกดดัน · ราคา ขนาด เลข อย. โปร วันตัดรอบ เป็นตัวแทน `[...]`\n\n---\n\n## 5. ความเสี่ยงจากรีวิวที่กระทบงาน CRM และวิธีรับมือ\n\nจาก `data/reviews_2025.csv` (380 รายการ)\n\n| ความเสี่ยง | รีวิว | ช่องทางที่เกิด | ทำไมเกี่ยวกับแคมเปญนี้ | วิธีรับมือ |\n|---|---:|---|---|---|\n| **แอดมินตอบช้า** (\"แอดมินตอบช้ามาก ทักไปสองวัน\") | **9** (คะแนน 1–2 ทุกรายการ) | LINE OA 4 · Shopee 2 · Lazada 2 · TikTok 1 | ทุกข้อความในแผนชวนทักแชท และ LINE OA ซึ่งเป็นช่องทางหลักของแผนมีรีวิวนี้มากที่สุด | • เพิ่มแอดมินวันที่ 3 (≈ 79 คลิกจาก LINE-2), 4 (FB-3), 10 (ไลฟ์), 12 (≈ 86 คลิกจาก M2) และ 13 (12.12) · ส่ง broadcast ช่วงที่มีแอดมินอยู่ ไม่ส่งดึก · ตั้งข้อความตอบอัตโนมัติแจ้งเวลาตอบกลับ · แยกแท็ก \"ส่งต่อเภสัชกร\" เป็นคิวของเภสัชกร ไม่ให้ค้างในคิวแอดมิน · ตั้งเป้าตอบภายในวันเดียวกัน |\n| **ส่งสินค้าผิด** (\"สั่งน้ำมันปลา ได้คอลลาเจนมา\") | **11** (คะแนน 1–2 ทุกรายการ) | TikTok 3 · Shopee 3 · LINE OA 2 · Lazada 2 · Facebook 1 | เพิ่ม SKU ใหม่ + ชุดของขวัญ + ออเดอร์ cross-sell หลายสินค้าในออเดอร์เดียว เสี่ยงหยิบผิดมากขึ้น ยิ่งเป็นของขวัญที่ส่งถึงบ้านคุณพ่อ ผิดแล้วแก้ยาก | • ให้ SKU ใหม่มีรหัสและกล่องที่ต่างจากสินค้าเดิมชัดเจน · สแกนบาร์โค้ด % | 28,000 | 2,000 | รวม LBL+GFT เทียบ 1,153 → 2.78 เท่า |\n| GFT | วิดีโอ 15s ของขวัญพ่อแม่ | Sales | Do | P3 | 12% | 16,800 | 1,200 | (รวมกับแถวบน) |\n| REV | วิดีโอรีวิวลูกค้าจริง 15s (มีเงื่อนไข) | Sales | Do | P2 | 8% | 11,200 | 1,600 (8–13 ธ.ค.) | 862 |\n| DPA | Retarget ดูสินค้า/ดูวิดีโอ 14–30 วัน | Sales | Do / Care | ทุก Pillar | 5.5% | 7,700 | 550 | 485 → **+13%** |\n| LEAD | ปรึกษาเภสัชกรฟรี (ลีดฟอร์ม/LINE) | Leads | Think / Care | P1 | 5% | 7,000 | 500 | 678 → **−26%** |\n| RES | งบสำรอง ปล่อยตามกฎ scale (ข้อ 4) | – | Do | ตามผลจริง | 10.5% | 14,700 | – | – |\n| | **รวม** | | | | **100%** | **140,000** | 10,000 | 6,664 → 1.50 เท่า |\n\n**ตรวจกับเป้า Pillar** (ไม่นับ DPA และงบสำรองที่ใช้ร่วมทุก Pillar ซึ่งรวมกัน 16% → เหลือ 84%):\nP1 = 22 + 5 + 11 = 38 → 38/84 = **45.2%** · P2 = 20 + 8 = 28 → **33.3%** · P3 = 12 + 6 = 18 → **21.4%** (เป้า 45 / 35 / 20)\n\n**ตรวจกับกฎของ Lab 7:**\n- DPA +13% (ไม่เกิน 15%) และ LEAD −26% (ลดตามที่ Lab 7 แนะนำ) · **ล็อกเป็นจำนวนเงิน** (7,700 / 7,000 ฿) ไม่ว่าจะเลือกงบทางไหน เงินส่วนที่เหลือให้ไปลง RES\n- เงินที่เพิ่มขึ้นส่วนใหญ่ไปลงวิดีโอ 3 รูปแบบที่ Lab 7 บอกให้เพิ่ม (PHA, LBL/GFT) แต่ระดับงบ 2.8–2.9 เท่าของอดีต **ยังไม่เคยทดสอบ** ยิ่งใช้งบมากผลต่อบาทอาจยิ่งลดลง ข้อ 3 จึงให้ใช้ **กรณีระมัดระวัง** เป็นตัวเลขวางแผน และข้อ 4 กำหนดกฎหยุดไว้ล่วงหน้า\n- เพิ่มงบรายตัวระหว่างแคมเปญได้ครั้งละไม่เกิน 20% (ตาม Lab 7) งบแนะนำนี้คือระดับตั้งต้นของชุดโฆษณาใหม่ ไม่ใช่การเพิ่มงบให้ชุดเดิม\n- คำถามเรื่องการทานคู่กับยาหรือโรคประจำตัว ที่เข้ามาผ่าน LEAD หรือแชท ให้ **ส่งต่อเภสัชกร** ทุกครั้ง\n\n### ตารางงบรายวัน (แนะนำ 140,000 ฿)\nน้ำหนักรายวันตั้งตามหลักฐาน: วันเลขเบิ้ลในอดีตใช้งบ 1.90 เท่า และแอดยอดขายในวันนั้นมี ROAS 6.66 เทียบวันปกติ 5.55 (CPM ใกล้เคียงกัน 90.89 vs 92.41 ฿) · ยอดขายจริงวันที่ 12.12 ปี 2568 = **4.28 เท่า** ของค่ากลางรายวัน 1–20 ธ.ค. ส่วนวันพ่อ 5 ธ.ค. 2568 = 1.14 เท่า → ของขวัญวันพ่อต้องซื้อ **ก่อน** วันจริง จึงเพิ่มน้ำหนัก GFT ช่วง 2–4 ธ.ค. `[สมมติฐาน: ตัวคูณรายวันของแต่ละรูปแบบ]`\n\n| วัน | AWR | PHA | LBL | GFT | REV* | D ประหยัด 95,000 ฿ | **แนะนำ 140,000 ฿** | เต็มที่ 190,000 ฿ |\n|---|---|---|---|\n| งบแอดยอดขาย (รวม RES) | 74,100 ฿ | **109,200 ฿** | 148,200 ฿ |\n| ออร์เดอร์ | 282–429 | **415–633** | 564–859 |\n| ยอดขาย @1,034 ฿ | 291,000–444,000 ฿ | **429,000–654,000 ฿** | 583,000–888,000 ฿ |\n| ROAS แอดยอดขาย | 3.93–5.99 | 3.93–5.99 | 3.93–5.99 (น่าจะต่ำกว่านี้จริง) |\n| AWR ThruPlay | ~78,000–79,000 | ~115,000–116,000 | ~156,000–158,000 |\n| ลีด | 33–44 | 48–65 | 65–89 |\n| ความเสี่ยงหลัก | ได้ข้อมูลน้อย ตัดสินแต่ละรูปแบบได้ช้า | งบต่อรูปแบบ 2.8–2.9 เท่าของที่เคยทดสอบ | งบต่อรูปแบบ ~3.8–3.9 เท่า กลุ่ม 40+ อิ่มเร็ว ความถี่จะชนเพดาน · DPA/LEAD ต้องล็อกเงินไว้ เงินส่วนเกินไปลง RES |\n\nอ่านผล: ในทางเลือกแนะนำ แม้กรณีระมัดระวัง ROAS 3.93 ยังสูงกว่าจุดคุ้มทุน 1.57 ประมาณ 2.5 เท่า แต่ ROAS ตรงนี้คำนวณจากยอดต่อออร์เดอร์ที่สมมติไว้ **ถ้าราคาแคลเซียมต่ำ ROAS จะลดลงตามสัดส่วน** เช่น ที่ 709 ฿ ROAS กรณีระมัดระวัง = 3.93 × 709/1,034 ≈ 2.69 · และ ROAS ที่ Meta รายงานเป็นยอดที่ Meta นับเอง ยังไม่หักยอดที่ถูกยกเลิกหรือคืนสินค้า\n\n---\n\n## 4. KPI และกฎหยุด / เพิ่มงบ\n\n### จุดคุ้มทุน\n- ROAS คุ้มทุน = 1 ÷ อัตรากำไรขั้นต้น · กำไรขั้นต้นของสินค้าเดิม 68.6–73.3% → **1.36–1.46** (ราคาเต็ม)\n- หักส่วนลดเฉลี่ยของออร์เดอร์ที่สำเร็จ 13.3% → กำไรขั้นต้น 63.8–69.2% → **1.44–1.57**\n- `[สมมติฐาน]` ยังไม่มีต้นทุนแคลเซียม จึงใช้ช่วงของสินค้าเดิมไปก่อน ให้ทีมสินค้ากรอกต้นทุนจริงแล้วคำนวณใหม่\n- ใช้ **1.57** เป็นเส้นหยุด (เผื่อไว้ก่อน) · CPA คุ้มทุน = ยอดต่อออร์เดอร์ ÷ 1.57 (ที่ 1,034 ฿ ≈ 659 ฿)\n\n### กฎรวม (ใช้กับแอดยอดขาย PHA / LBL / GFT / REV / DPA)\n| กฎ | เงื่อนไข | ทำอะไร |\n|---|---|---|\n| ห้ามตัดสินเร็ว | ยังไม่ครบ 3 วัน หรือใช้งบยังไม่ถึง 2 เท่าของ CPA คุ้มทุน (~1,300 ฿) | ยังไม่ปรับ |\n| **หยุด** | ครบ 3 วันแล้ว ROAS สะสม **< 1.57** หรือใช้ไป ~1,300 ฿ แล้วยังไม่มีการซื้อ | ปิดตัวนั้น ย้ายงบไปตัวที่ผ่านเกณฑ์ |\n| ลดงบ 20% | ROAS 1.57–3.93 (ต่ำกว่าค่าประมาณกรณีระมัดระวัง) 3 วันติด | ลดงบ แล้วดูอีก 2–3 วัน |\n| **เพิ่มงบ +20% / ปล่อยงบสำรอง** | ROAS ≥ 3.93 ติดกัน 3 วัน **และ** ความถี่ < 2.5 **และ* const TAB_OF={'lab1-dashboard.html':'lab1','lab2-comparison.html':'lab2','lab3-pillars.html':'lab3','lab4-content-plan.md':'lab4',
  'lab5-post.html':'lab5','lab5-image-prompt.md':'lab5','lab6-summary.md':'lab6','lab7-ads-report.html':'lab7',
  'campaign-plan.md':'camp','campaign-crm.md':'camp','campaign-budget.md':'camp'};
function md(src){
  const d=document.createElement('div');d.className='prose';d.innerHTML=marked.parse(src);
  d.querySelectorAll('table').forEach(t=>{const w=document.createElement('div');w.className='tw';t.replaceWith(w);w.appendChild(t)});
  d.querySelectorAll('a[href]').forEach(a=>{const f=a.getAttribute('href').split('/').pop().split('#')[0];
    if(TAB_OF[f]){a.onclick=e=>{e.preventDefault();go(TAB_OF[f])}} else a.target='_blank'});
  return d;
}

/* ---------- builders ---------- */
const el=(h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild};
function head(k,h,p,extra=''){return `<div class="ph"><div><div class="k">${k}</div><h1>${h}</h1>${p?`<p>${p}</p>`:''}</div><div class="chips">${extra}</div></div>`}
function frame(src,note){
  const f=el(`<div><div class="frame"><div class="ld">กำลังโหลด…</div><iframe scrolling="no" title="${src}"></iframe></div>
    <div class="foot">${note||''}</div></div>`);
  const ifr=f.querySelector('iframe');ifr.onload=()=>f.querySelector('.frame').classList.add('ok');ifr.dataset.src=src;return f;
}
function subtabs(items){ // items [{label, node}]
  const w=el('<div><div class="sub"></div></div>');const bar=w.firstChild;
  items.forEach((it,i)=>{const b=el(`<button aria-pressed="${i===0}">${it.label}</button>`);const p=el(`<div class="sp${i===0?' on':''}"></div>`);
    p.appendChild(it.node);w.appendChild(p);
    b.onclick=()=>{bar.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');
      w.querySelectorAll('.sp').forEach(x=>x.classList.remove('on'));p.classList.add('on');loadFrames(p)};
    bar.appendChild(b)});
  return w;
}

/* ---------- tabs ---------- */
const nav=document.getElementById('tabs'),main=document.getElementById('main'),ink=document.getElementById('ink');
const built={};
TABS.forEach(t=>{const b=el(`<button class="tab" role="tab" aria-selected="false" data-id="${t.id}"><small>${t.k}</small>${t.t}</button>`);b.onclick=()=>go(t.id);nav.appendChild(b)});
document.querySelector('.brand').onclick=()=>go('overview');
function loadFrames(scope){scope.querySelectorAll('iframe[data-src]').forEach(f=>{if(f.offsetParent!==null&&!f.src){f.src=f.dataset.src}})}
function moveInk(b){ink.style.left=b.offsetLeft+'px';ink.style.width=b.offsetWidth+'px';b.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'})}
function go(id,push=true){
  if(!BUILD[id]) id='overview';
  if(!built[id]){const p=el(`<section class="panel" role="tabpanel" id="p-${id}"></section>`);p.appendChild(BUILD[id]());main.appendChild(p);built[id]=p}
  main.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p===built[id]));
  nav.querySelectorAll('.tab').forEach(b=>{const on=b.dataset.id===id;b.setAttribute('aria-selected',on);if(on)moveInk(b)});
  loadFrames(built[id]);
  if(push) history.replaceState(null,'','#'+id);
  scrollTo({top:0,behavior:'smooth'});
}
/* หน้าที่ฝังส่งความสูงจริงมา → ยืดกรอบให้เท่าเนื้อหา (มีแถบเลื่อนเดียวคือของหน้าหลัก) */
addEventListener('message',e=>{const h=e.data&&e.data.hubH;if(!h)return;
  document.querySelectorAll('iframe').forEach(f=>{if(f.contentWindow===e.source)f.style.height=h+'px'})});
addEventListener('resize',()=>{const b=nav.querySelector('[aria-selected=true]');if(b)moveInk(b)});
addEventListener('hashchange',()=>go(location.hash.slice(1),false));
go(location.hash.slice(1)||'overview',false);
</script>
